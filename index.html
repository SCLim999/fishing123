                           14 + len, oy * 1.6 + sw * 9);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
    ctx.fillStyle = "#a8446e";                             // 尾端两片三角鳍
    ctx.beginPath();
    ctx.moveTo(-26, -8); ctx.lineTo(-48, -22 + wig * 4); ctx.lineTo(-30, 0);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-26, 8); ctx.lineTo(-48, 22 - wig * 4); ctx.lineTo(-30, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#d4699a";                             // 身体（胴部）
    ctx.beginPath(); ctx.ellipse(0, 0, 32, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.ellipse(-6, 6, 20, 6, 0, 0, Math.PI * 2); ctx.fill();
    eye(16, -4, 5.5);
  }

  function artTurtle(it) {                                // 海龟
    const p = Math.sin(it.t * 3) * 0.5;
    ctx.fillStyle = "#3f8f6f";                            // 前后鳍
    ctx.save(); ctx.translate(12, -14); ctx.rotate(-0.5 + p);
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(12, 14); ctx.rotate(0.5 - p);
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.ellipse(-26, 10, 11, 6, 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4fa87f";                            // 头
    ctx.beginPath(); ctx.ellipse(30, 0, 13, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2f6b52";                            // 龟壳
    ctx.beginPath(); ctx.ellipse(0, 0, 30, 22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3f8f6f";
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2f6b52";
    [[-12, -6], [0, -9], [12, -5], [-8, 7], [6, 8]].forEach(([sx, sy]) => {
      ctx.beginPath(); ctx.ellipse(sx, sy, 5.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    });
    eye(35, -3, 3.2);
  }

  function artJelly(it) {                                 // 水母
    const pulse = 1 + Math.sin(it.t * 2.2) * 0.12;
    ctx.save();
    ctx.scale(pulse, 1 / pulse);
    ctx.fillStyle = "rgba(198,150,255,.30)";
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(214,170,255,.85)";              // 伞盖
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 18, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.beginPath(); ctx.ellipse(-7, -6, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(226,190,255,.9)"; ctx.lineWidth = 2.6;   // 触须
    for (let i = 0; i < 5; i++) {
      const x = -16 + i * 8;
      ctx.beginPath(); ctx.moveTo(x, 0);
      ctx.quadraticCurveTo(x + Math.sin(it.t * 3 + i) * 8, 16, x + Math.sin(it.t * 3 + i) * 5, 30);
      ctx.stroke();
    }
    ctx.restore();
  }

  function artPuffer(it) {                                // 河豚
    const r = 22 + Math.sin(it.t * 2) * 2;
    ctx.fillStyle = "#c9a227";                            // 刺
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.1) * r, Math.sin(a - 0.1) * r);
      ctx.lineTo(Math.cos(a) * (r + 9), Math.sin(a) * (r + 9));
      ctx.lineTo(Math.cos(a + 0.1) * r, Math.sin(a + 0.1) * r);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#8bd3a0";                            // 小尾巴
    ctx.beginPath();
    ctx.moveTo(-r, 0); ctx.lineTo(-r - 14, -9); ctx.lineTo(-r - 14, 9);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f2e07a";                            // 圆身体
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.beginPath(); ctx.ellipse(-3, 8, r * 0.6, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    eye(11, -6, 5);
    ctx.strokeStyle = "#a8863a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(16, 6, 5, -0.6, 0.9); ctx.stroke();
  }

  function artCrab(it) {                                  // 螃蟹
    const wig = Math.sin(it.t * 6) * 3;
    ctx.strokeStyle = "#b83b2a"; ctx.lineWidth = 3.5;      // 腿
    for (let i = 0; i < 3; i++) {
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * (6 + i * 7), 6);
        ctx.lineTo(s * (14 + i * 8), 16 + (i % 2 ? wig : -wig));
        ctx.stroke();
      }
    }
    ctx.fillStyle = "#d9482f";                             // 钳子
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * 22, -4); ctx.rotate(s * (0.5 + Math.sin(it.t * 4) * 0.2));
      ctx.beginPath(); ctx.ellipse(0, 0, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = "#e85a3c";                             // 壳
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.25)";
    ctx.beginPath(); ctx.ellipse(-5, -4, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
    eye(-6, -12, 4); eye(6, -12, 4);
  }

  function artCoin(it) {
    const s = Math.abs(Math.cos(it.t * 2.4));
    ctx.fillStyle = "rgba(255,210,74,.18)";
    ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e9a821";
    ctx.beginPath(); ctx.ellipse(0, 0, 13 * (0.25 + s * 0.75), 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd24a";
    ctx.beginPath(); ctx.ellipse(0, 0, 13 * (0.15 + s * 0.55), 9.6, 0, 0, Math.PI * 2); ctx.fill();
  }

  function artChest(it) {
    const glow = 0.5 + Math.sin(it.t * 5) * 0.3;
    ctx.fillStyle = `rgba(255,210,74,${0.16 * glow})`;
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
    ctx.translate(0, Math.sin(it.t * 2) * 2);
    ctx.fillStyle = "#7a4c1c"; ctx.fillRect(-24, -8, 48, 24);
    ctx.fillStyle = "#c98b3a";
    ctx.beginPath(); ctx.moveTo(-24, -8); ctx.quadraticCurveTo(0, -34, 24, -8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffd24a"; ctx.fillRect(-26, -11, 52, 5); ctx.fillRect(-5, -5, 10, 17);
  }

  function artBoot(it) {                                  // 破靴子：钓上来只是白费力气
    const sway = Math.sin(it.t * 1.6) * 0.12;
    ctx.rotate(sway);
    ctx.fillStyle = "#4a3b32";                            // 靴筒
    pill(-10, -24, 20, 30, 5); ctx.fill();
    ctx.fillStyle = "#5c4a3f";                            // 靴头
    ctx.beginPath();
    ctx.moveTo(-10, -2); ctx.lineTo(24, 4);
    ctx.quadraticCurveTo(28, 14, 18, 14); ctx.lineTo(-10, 14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#33282210";
    ctx.fillStyle = "#2f2621"; ctx.fillRect(-11, 12, 37, 5);   // 鞋底
    ctx.fillStyle = "rgba(255,255,255,.12)";
    pill(-6, -20, 7, 16, 3); ctx.fill();
    ctx.strokeStyle = "#7d8b93"; ctx.lineWidth = 2;            // 挂着的水草
    ctx.beginPath(); ctx.moveTo(6, -22); ctx.quadraticCurveTo(16, -14, 10, -4); ctx.stroke();
  }

  function artMine(it) {                                  // 水雷：钓到扣时间
    const blink = 0.5 + Math.sin(it.t * 6) * 0.5;
    ctx.fillStyle = `rgba(255,80,60,${0.10 + blink * 0.12})`;
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#8d9aa3"; ctx.lineWidth = 2;            // 系在海底的缆绳
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.quadraticCurveTo(Math.sin(it.t) * 6, 34, 0, 46); ctx.stroke();
    ctx.fillStyle = "#2c3a44";                                 // 刺
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + it.t * 0.3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.12) * 16, Math.sin(a - 0.12) * 16);
      ctx.lineTo(Math.cos(a) * 26, Math.sin(a) * 26);
      ctx.lineTo(Math.cos(a + 0.12) * 16, Math.sin(a + 0.12) * 16);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#3b4c58";                                 // 雷体
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.16)";
    ctx.beginPath(); ctx.arc(-5, -5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,70,60,${0.45 + blink * 0.55})`;  // 闪烁的红灯
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
  }

  function artMagnet(it) {                                // 磁铁
    const glow = 0.5 + Math.sin(it.t * 4) * 0.5;
    ctx.fillStyle = `rgba(155,231,255,${0.12 + glow * 0.1})`;
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#d9433a"; ctx.lineWidth = 9; ctx.lineCap = "butt";
    ctx.beginPath(); ctx.arc(0, 2, 12, Math.PI, 0); ctx.stroke();       // 马蹄
    ctx.fillStyle = "#dfe9f0";
    ctx.fillRect(-17, 2, 9, 11); ctx.fillRect(8, 2, 9, 11);             // 两个银极
  }

  function artBighook(it) {                               // 大钩
    const glow = 0.5 + Math.sin(it.t * 4) * 0.5;
    ctx.fillStyle = `rgba(155,231,255,${0.12 + glow * 0.1})`;
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#e2ecf2"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(2, -16); ctx.lineTo(2, 4);
    ctx.arc(-5, 4, 7, 0, Math.PI * 0.85); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, -16); ctx.lineTo(10, -16); ctx.stroke();
  }

  function artWatch(it) {                                 // 怀表
    const glow = 0.5 + Math.sin(it.t * 4) * 0.5;
    ctx.fillStyle = `rgba(139,245,168,${0.12 + glow * 0.12})`;
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#d9a521";
    ctx.beginPath(); ctx.arc(0, 2, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f4e6c0";
    ctx.beginPath(); ctx.arc(0, 2, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#d9a521"; ctx.fillRect(-3, -17, 6, 5);            // 表冠
    ctx.strokeStyle = "#5a3a10"; ctx.lineWidth = 2;                     // 指针
    ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, -5);
    ctx.moveTo(0, 2); ctx.lineTo(Math.cos(it.t) * 6, 2 + Math.sin(it.t) * 6); ctx.stroke();
  }

  function artTurbo(it) {                                 // 浮标（快收线）
    const glow = 0.5 + Math.sin(it.t * 5) * 0.5;
    ctx.fillStyle = `rgba(255,210,74,${0.14 + glow * 0.12})`;
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e2574c";                                          // 上半红
    ctx.beginPath(); ctx.arc(0, 0, 14, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#f2f2f2";                                          // 下半白
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI); ctx.fill();
    ctx.fillStyle = "#ffd24a";                                          // 闪电
    ctx.beginPath();
    ctx.moveTo(-4, -8); ctx.lineTo(4, -1); ctx.lineTo(0, -1);
    ctx.lineTo(5, 9); ctx.lineTo(-3, 1); ctx.lineTo(1, 1);
    ctx.closePath(); ctx.fill();
  }

  function artInk(it) {                                   // 墨囊
    const p = 1 + Math.sin(it.t * 3) * 0.08;
    ctx.scale(p, p);
    ctx.fillStyle = "rgba(198,162,255,.18)";
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2a2340";
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4b3f6b";
    ctx.beginPath(); ctx.ellipse(-4, -4, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#2a2340"; ctx.lineWidth = 3;         // 几条小触手
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(-8 + i * 8, 10);
      ctx.quadraticCurveTo(-8 + i * 8 + Math.sin(it.t * 4 + i) * 5, 20, -8 + i * 8, 26);
      ctx.stroke();
    }
  }

  const ART = { shark:artShark, whale:artWhale, manta:artManta, lobster:artLobster,
                seahorse:artSeahorse, starfish:artStarfish, ink:artInk, magnet:artMagnet, bighook:artBighook, watch:artWatch, turbo:artTurbo,
                boot:artBoot, mine:artMine, fish:artFish, sword:artSword, angler:artAngler, boss:artBoss, squid:artSquid,
                turtle:artTurtle, jelly:artJelly, puffer:artPuffer, crab:artCrab,
                coin:artCoin, chest:artChest };

  function pill(x, y, w, h, r) {                   // 圆角底片（比 ctx.roundRect 兼容性稳）
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 头顶的分数标签（街机风：黄字黑边，加半透明底片保证在浅色鱼身上也看得清）
  function drawValue(x, y, val, color) {
    const t = String(val);
    ctx.font = "900 17px 'Segoe UI',sans-serif";
    ctx.textAlign = "center";
    const w = ctx.measureText(t).width + 12;
    ctx.fillStyle = "rgba(3,18,32,.5)";
    pill(x - w / 2, y - 14, w, 19, 6);
    ctx.fill();
    ctx.lineWidth = 3.5; ctx.strokeStyle = "rgba(0,0,0,.7)";
    ctx.strokeText(t, x, y);
    ctx.fillStyle = color || "#ffd24a";
    ctx.fillText(t, x, y);
  }

  function drawItem(it) {
    const fading = it.life < 3 && Math.floor(it.life * 6) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = (fading ? 0.4 : 1) * nightAlpha(it);
    ctx.translate(it.x, it.y);
    // 水母、金币、宝箱没有朝向；其它按游动方向翻转
    if (!["jelly", "coin", "chest", "mine", "boot", "magnet", "bighook", "watch", "turbo", "ink",
          "starfish", "seahorse"].includes(it.kind.art)) ctx.scale(it.vx >= 0 ? 1 : -1, 1);
    ART[it.kind.art](it);
    ctx.restore();
    if (it.stun > 0) {                                 // 被震晕的小星星
      ctx.fillStyle = "#f2e07a";
      for (let i = 0; i < 3; i++) {
        const a = it.t * 4 + i * 2.1;
        ctx.beginPath();
        ctx.arc(it.x + Math.cos(a) * 14, it.y - it.kind.hh - 8 + Math.sin(a) * 4, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /* 分数标签单独一遍画在最上层：值钱的优先，挤在一起的让位，
     否则鱼一多（上限 26 个）头顶的数字会叠成一团看不清 */
  function drawLabels() {
    const taken = [];
    const queue = items.concat(hook.catches)
      .filter(it => it.y > SEA_Y + 4)
      // 危险物排最前：看清水雷比看清小鱼分数更重要
      .sort((a, b) => (b.kind.hazard ? 1e6 : itemScore(b)) - (a.kind.hazard ? 1e6 : itemScore(a)));
    for (const it of queue) {
      const x = it.x, y = it.y - it.kind.lo;
      if (taken.some(l => Math.abs(l.x - x) < 34 && Math.abs(l.y - y) < 19)) continue;
      taken.push({ x, y });
      ctx.globalAlpha = it.life < 3 && Math.floor(it.life * 6) % 2 === 0 ? 0.5 : 1;
      drawValue(x, y, it.kind.label != null ? it.kind.label : itemScore(it), it.kind.labelColor);
      ctx.globalAlpha = 1;
    }
  }

  function drawStruggle() {
    const g  = struggle;
    const bw = 250, bh = 16;
    const bx = clamp(hook.x, bw / 2 + 12, W - bw / 2 - 12) - bw / 2;
    const by = clamp(hook.y - 108, SEA_Y + 30, H - 60);

    ctx.fillStyle = "rgba(3,18,32,.72)";                  // 轨道
    pill(bx - 4, by - 4, bw + 8, bh + 8, 8); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.14)";
    pill(bx, by, bw, bh, 6); ctx.fill();

    const zx = bx + (0.5 - g.zone) * bw, zw = g.zone * 2 * bw;
    ctx.fillStyle = g.boost > 0 ? "rgba(139,245,168,.95)" : "rgba(139,245,168,.6)";
    pill(zx, by, zw, bh, 6); ctx.fill();                  // 绿区

    const mx = bx + g.pos * bw;                           // 指针
    ctx.fillStyle = "#ffd24a";
    pill(mx - 3, by - 5, 6, bh + 10, 3); ctx.fill();

    ctx.textAlign = "center";                             // 鱼名 + 拉了几次
    ctx.font = "900 14px 'Segoe UI','PingFang SC',sans-serif";
    ctx.lineWidth = 3.5; ctx.strokeStyle = "rgba(0,0,0,.65)";
    const label = g.name + (g.hits ? `　×${g.hits}` : "");
    ctx.strokeText(label, bx + bw / 2, by - 10);
    ctx.fillStyle = g.boost > 0 ? "#8bf5a8" : "#e8f6ff";
    ctx.fillText(label, bx + bw / 2, by - 10);
  }

  function draw() {
    drawBackground();

    for (const b of bubbles) {
      ctx.fillStyle = "rgba(210,244,255,.3)";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }

    for (const it of items.slice().sort((a, b) => b.y - a.y)) drawItem(it);   // 深的先画
    for (const c of hook.catches) drawItem(c);
    if (SCENES[scene].dark) drawLamp();
    drawLabels();

    if (inkT > 0) {                                // 墨迹糊在最上层
      const a = Math.min(1, inkT / 0.6);
      // 要够黑：夜里的深水本来就暗，墨太淡反而是「提亮」，看着不像被糊住
      ctx.fillStyle = `rgba(8,6,16,${0.93 * a})`;
      for (const b of inkBlobs) {
        ctx.beginPath();
        ctx.ellipse(b.x * W, SEA_Y + b.y * (H - SEA_Y), b.r * 1.25, b.r, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    if (struggle) drawStruggle();
    if (!spectating) { drawShip(); drawLine(); }
    if (online) { drawRemotes(); drawEmotes(); }
    if (spectating) {
      ctx.font = "900 20px 'Segoe UI','PingFang SC',sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.55)";
      ctx.strokeText(t("spectating"), W / 2, 52);   // 放天空里，别压到别人的船
      ctx.fillStyle = "#9be7ff"; ctx.fillText(t("spectating"), W / 2, 52);
    }

    for (const s of sparks) {
      ctx.globalAlpha = 1 - s.t / s.life;
      ctx.fillStyle = s.color;
      ctx.fillRect(s.x, s.y, 3, 3);
      ctx.globalAlpha = 1;
    }

    drawWeather(lastDt);

    ctx.textAlign = "center";
    for (const p of pops) {
      ctx.globalAlpha = clamp(1.4 - p.t, 0, 1);
      ctx.font = `900 ${p.size}px 'Segoe UI','PingFang SC',sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.7)";
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }

    // 常驻提示靠左上角贴着水面排，中间那一列留给漂浮的得分，免得叠成一团
    if (state === "playing") {
      if (fever) {
        ctx.fillStyle = `rgba(255,122,40,${0.09 + Math.sin(waveT * 6) * 0.03})`;
        ctx.fillRect(0, SEA_Y, W, H - SEA_Y);
      }
      ctx.textAlign = "left";
      let hy = SEA_Y + 28;
      if (fever) {
        ctx.font = "900 22px 'Segoe UI','PingFang SC',sans-serif";
        ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.55)";
        ctx.strokeText(t("hud_fever"), 14, hy);
        ctx.fillStyle = `rgba(255,196,90,${0.85 + Math.sin(waveT * 7) * 0.15})`;
        ctx.fillText(t("hud_fever"), 14, hy);
        hy += 26;
      }
      if (coop && online) {
        ctx.font = "900 16px 'Segoe UI','PingFang SC',sans-serif";
        ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.6)";
        const ct = t("coop_hud", { team: coopTeam, target: coopTarget });
        ctx.strokeText(ct, 14, hy);
        ctx.fillStyle = coopTeam >= coopTarget ? "#8bf5a8" : "#9be7ff";
        ctx.fillText(ct, 14, hy);
        hy += 22;
      }
      if (daily) {
        ctx.font = "900 14px 'Segoe UI','PingFang SC',sans-serif";
        ctx.lineWidth = 3.5; ctx.strokeStyle = "rgba(0,0,0,.6)";
        const dtxt = t("daily_on", { date: todayKey() });
        ctx.strokeText(dtxt, 14, hy); ctx.fillStyle = "#9be7ff"; ctx.fillText(dtxt, 14, hy);
        hy += 20;
      }
      const activePw = [];
      if (powers.magnet  > 0) activePw.push("🧲" + Math.ceil(powers.magnet));
      if (powers.bighook > 0) activePw.push("⚓" + Math.ceil(powers.bighook));
      if (powers.turbo   > 0) activePw.push("⚡" + Math.ceil(powers.turbo));
      if (activePw.length) {
        ctx.font = "900 16px 'Segoe UI','PingFang SC',sans-serif";
        ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.6)";
        const txt = activePw.join("　");
        ctx.strokeText(txt, 14, hy); ctx.fillStyle = "#9be7ff"; ctx.fillText(txt, 14, hy);
        hy += 22;
      }
      if (combo >= 2) {
        ctx.font = "900 17px 'Segoe UI','PingFang SC',sans-serif";
        ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.6)";
        const txt = t("hud_combo", { c: combo, m: comboMult().toFixed(1) });
        ctx.strokeText(txt, 14, hy);
        ctx.fillStyle = "#ffb35e"; ctx.fillText(txt, 14, hy);
        hy += 24;
      }
      if (!online && missions.length) {              // 本局的三个小目标
        ctx.font = "700 13px 'Segoe UI','PingFang SC',sans-serif";
        ctx.lineWidth = 3.5; ctx.strokeStyle = "rgba(0,0,0,.6)";
        for (const m of missions) {
          const d = m.def;
          const mt = missionText(d);
          const txt = m.done ? `✔ ${mt}` : d.goal > 1 ? `◻ ${mt}${prog(m)}` : `◻ ${mt}`;
          ctx.strokeText(txt, 14, hy);
          ctx.fillStyle = m.done ? "#9be7ff" : "rgba(226,244,255,.72)";
          ctx.fillText(txt, 14, hy);
          hy += 18;
        }
      }
      ctx.textAlign = "center";
    }
    if (state === "playing" && timeLeft <= 10) {
      ctx.font = "900 64px 'Segoe UI',sans-serif";
      ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.45)";
      const n = String(Math.ceil(timeLeft));
      ctx.strokeText(n, W / 2, 130);
      ctx.fillStyle = `rgba(255,110,100,${0.55 + Math.sin(waveT * 8) * 0.25})`;
      ctx.fillText(n, W / 2, 130);
    }
  }

  // ───────────────────────── 联机 ─────────────────────────
  /* 分工：服务器管世界（出什么鱼、归谁、分数、计时、FEVER），
     本地管手感（鱼怎么游、钩子怎么动）。鱼的移动不走网络，出生时拿到
     x/y/vx/life 后两边各自推进，所以不会抖；需要仲裁的只有「这条鱼归谁」。 */

  function netItem(w) {                             // 服务器下发的一条鱼
    const kind = KINDS[w.kind];
    if (!kind) return;
    items.push({
      id: w.kind, netId: w.id, kind, dir: w.vx >= 0 ? 1 : -1,
      x: w.x, y: w.y, vx: w.vx,
      wob: Math.random() * Math.PI * 2, t: 0, life: w.life, dart: 0,
    });
  }

  function netDrop(netId) {                         // 从海里和我的钩子上都摘掉
    const i = items.findIndex(it => it.netId === netId);
    if (i >= 0) items.splice(i, 1);
    const c = hook.catches.findIndex(it => it.netId === netId);
    if (c >= 0) hook.catches.splice(c, 1);          // 被别人抢先了，乐观挂上的要回滚
    hook.pull = pullSpeed();
  }

  /* 大货拉扯：钓到 400 分以上的东西时，收线不再是干等十几秒 ——
     指针来回跑，点在绿区里就猛拉一下，点歪了会滑一下。
     只影响收线速度，不会把鱼弄掉，所以联机也能用（分数在钩到那刻就由服务器结算了）。 */
  /* 每局的天色：只影响观感（配色、雨、闪电、船摇），不动任何数值 ——
     联机时由服务器随 start 下发，保证一屋子人看到同一片天。 */
  const SCENES = {
    day:   { w:38, sky:["#8fd8f2","#d9f2fb"], sea:["#1d8fc4","#0e6395","#03203a"],
             cloud:"rgba(255,255,255,.75)", ray:0.07, bob:1 },
    dusk:  { w:20, sky:["#ff9e6b","#ffe0b5"], sea:["#2a6d92","#1b4a6b","#04182b"],
             cloud:"rgba(255,222,196,.7)",  ray:0.05, bob:1.2 },
    night: { w:25, sky:["#08152b","#1d3557"], sea:["#0d3550","#08243a","#010d18"],
             cloud:"rgba(200,215,240,.32)", ray:0.03, bob:1, dark:0.58 },
    storm: { w:17, sky:["#3f4d59","#8a9aa6"], sea:["#16607f","#0b4460","#021726"],
             cloud:"rgba(208,218,228,.55)", ray:0.02, bob:2.3, rain:true, bolt:true },
  };
  const SCENE_IDS = Object.keys(SCENES);
  let scene = "day", boltT = 0, boltNext = 5;

  /* 地图 = 「在哪片海钓」，和天色（SCENES = 什么天气/时辰）是两条独立的轴，
     所以每局是「地图 × 天色」的组合。地图不只是换皮：
     `mul` 会乘到出鱼权重上，所以珊瑚礁真的小鱼多、深海沟真的大货多 ——
     换了地方就得换打法，而不是同一片海刷不同滤镜。
     没写进 mul 的种类保持原权重；写 0 就是这片海根本不出。 */
  const MAPS = {
    open:   { zh:"外海",     en:"Open Sea",     w:26, floor:"weed",
              mul:{} },
    reef:   { zh:"珊瑚礁",   en:"Coral Reef",   w:22, floor:"coral",
              sea:["#2aa6cf","#158cb4","#06375a"],
              mul:{ clown:2.6, small:2.2, seahorse:2.4, starfish:2.2, crab:1.8, lobster:1.6,
                    jelly:1.5, puffer:1.6, angler:0.2, boss:0, whale:0, shark:0.5, manta:0.6 } },
    trench: { zh:"深海沟",   en:"Deep Trench",  w:18, floor:"rock",
              sea:["#0d4a6b","#07304a","#01101c"],
              mul:{ angler:3, squid:2.2, shark:1.8, manta:1.6, whale:1.4, boss:1,
                    clown:0.2, small:0.3, seahorse:0.2, starfish:0.3, coin:0.6 } },
    wreck:  { zh:"沉船遗址", en:"Shipwreck",    w:18, floor:"wreck",
              sea:["#1a7d9e","#0f5573","#031d30"],
              mul:{ coin:2.4, boot:2.2, mine:2, magnet:1.6, watch:1.6, bighook:1.6, turbo:1.6,
                    lobster:1.6, crab:1.5, whale:0.4, boss:0.6 } },
    polar:  { zh:"极地海",   en:"Polar Sea",    w:16, floor:"ice",
              sea:["#5fbfe0","#2e86ad","#062a44"],
              mul:{ whale:3.2, big:1.8, manta:1.4, sword:1.4, shark:1.3,
                    clown:0.2, seahorse:0.2, crab:0.4, lobster:0.4, jelly:0.6 } },
  };
  const MAP_IDS = Object.keys(MAPS);
  let gmap = "open";
  const mapName = id => (lang === "en" && MAPS[id].en) ? MAPS[id].en : MAPS[id].zh;

  /* 道具：钓到就生效一段时间。磁铁/大钩/快收线纯本地表现（联机也一致，
     因为抢鱼由服务器仲裁）；怀表要加时间，单人本地加、联机由服务器加。 */
  const POWERS = { magnet: { dur: 6 }, bighook: { dur: 8, mult: 1.8 },
                   turbo: { dur: 10, mult: 1.6 }, watch: { time: 5 }, ink: { offense: true } };
  let powers = { magnet: 0, bighook: 0, turbo: 0 };

  let inkT = 0;                                    // 被泼墨的剩余时间
  const inkBlobs = [];                             // 墨点位置（生成一次，别每帧乱跳）
  const emotes = new Map();                        // playerId -> {e, t}
  const EMOJI = ["👍", "😂", "🎣", "😱"];
  let coop = false, coopTeam = 0, coopTarget = 0;

  let struggle = null;
  let shakeT = 0;                                   // 画面震动剩余时间
  let hookReportT = 0;
  function netHookReport(dt) {                      // 10Hz 上报自己的钩子给别人看
    hookReportT -= dt;
    if (hookReportT > 0) return;
    hookReportT = 0.1;
    NET.send({ t:"hook", x: Math.round(hook.x), y: Math.round(hook.y),
               st: hook.state, n: hook.catches.length });
  }

  function netLerpHooks(dt) {                       // 别人的钩子插值，避免一跳一跳
    const k = Math.min(1, dt * 12);
    for (const h of NET.hooks.values()) {
      h.rx += (h.x - h.rx) * k;
      h.ry += (h.y - h.ry) * k;
    }
  }

  function netNote(text, cls = "") {
    el.mpNote.textContent = text;
    el.mpNote.className = "mp-note" + (cls ? " " + cls : "");
  }

  function goOnline() {
    let url  = el.mpUrl.value.trim();
    const room = (el.mpRoom.value.trim() || "LOBBY").toUpperCase();
    if (!url) { netNote(t("net_need_url"), "err"); return; }
    // wrangler deploy 打印的是 https:// 地址，直接粘贴要能用 —— 先把协议换成 WebSocket 的
    url = url.replace(/^https:\/\//i, "wss://").replace(/^http:\/\//i, "ws://");
    if (!/^wss?:\/\//i.test(url)) url = "wss://" + url.replace(/^\/+/, "");
    url = url.replace(/\/+$/, "");
    if (!/\/room$/.test(url)) url += "/room";
    try { localStorage.setItem(NET_KEY, url); } catch (_) {}

    const name = (el.mpName.value.trim() || NET.name ||
                  t("nick") + Math.floor(Math.random() * 90 + 10)).slice(0, 12);
    NET.name = name;
    el.mpName.value = name;
    try { localStorage.setItem(NAME_KEY, name); } catch (_) {}
    NET.room = room;
    netNote(t("net_connecting", { room }));

    let ws;
    try {
      const q = `room=${encodeURIComponent(room)}&name=${encodeURIComponent(name)}` +
                (el.mpSpec.checked ? "&spec=1" : "");
      ws = new WebSocket(`${url}?${q}`);
    } catch (e) { netNote(t("net_bad_url", { e: e.message }), "err"); return; }
    NET.ws = ws;

    ws.onopen  = () => netNote(t("net_connected", { room }), "ok");
    ws.onerror = () => netNote(t("net_fail"), "err");
    ws.onclose = () => {
      if (!online) { netNote(t("net_closed"), "err"); return; }
      online = false;
      resizeCanvas();                               // 回到单人，宽度可以再放开
      state = "menu";
      NET.hooks.clear(); NET.players.clear();
      el.over.classList.add("hidden");
      el.menu.classList.remove("hidden");
      netNote(t("net_dropped"), "err");
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
      netHandle(m);
    };
  }

  function netEnter() {                             // 第一次进入联机：清干净本地世界
    online = true;
    resizeCanvas();                                 // 联机固定标准宽度
    items = []; pops = []; sparks = [];
    hook = { state:"idle", x:W/2, y:SEA_Y, catches:[], pull:0 };
    struggle = null;
    combo = 0; score = 0; caught = {}; earned = {}; newSeen = [];
    el.menu.classList.add("hidden");
    el.over.classList.add("hidden");
  }

  function netHandle(m) {
    switch (m.t) {
      case "welcome":
        NET.you = m.you;
        spectating = !!m.spec;
        specCount = m.specs || 0;
        NET.players = new Map(m.players.map(p => [p.id, p]));
        netEnter();
        items = [];
        (m.items || []).forEach(netItem);
        timeLeft = m.time; fever = m.fever;
        if (m.map) gmap = MAPS[m.map] ? m.map : "open";
        if (m.scene) setScene(m.scene);            // setScene 会重烘背景，地图要先定好
        netNote(spectating ? t("net_spectating", { room: NET.room }) : t("net_connected", { room: NET.room }), "ok");
        el.stage.classList.toggle("fever", !!m.fever);
        state = "playing";
        if (m.state === "playing") {                          // 房间已经在打了：局时和模式都跟着房间走
          if (m.dur) { roundTime = m.dur; renderDurSeg(); }
          coop = !!m.coop; coopTarget = m.target || 0;
          el.mpCoop.checked = coop;
        } else {                                              // 房间还空着：我这一票定局时和模式
          coop = el.mpCoop.checked; coopTarget = 0; coopTeam = 0;
          NET.send({ t:"ready", dur: roundTime, coop });       // 别读 m.dur —— 那只是空房间的默认值
        }
        syncHud();
        break;

      case "joined":
        specCount = m.specs || 0;
        if (m.p.spec) { pop(W / 2, SEA_Y + 130, t("pop_join_spec", { name: m.p.name }), "#9be7ff", 18); break; }
        NET.players.set(m.p.id, m.p);
        pop(W / 2, SEA_Y + 130, t("pop_join", { name: m.p.name }), "#9be7ff", 19);
        break;

      case "left":
        specCount = m.specs || 0;
        NET.players.delete(m.id);
        NET.hooks.delete(m.id);
        break;

      case "start":
        netEnter();
        state = "playing";
        timeLeft = m.time; fever = false; bonusGiven = 0;
        if (m.dur) { roundTime = m.dur; renderDurSeg(); }
        // 联机的地图和天色都由服务器统一下发，一屋子人同一片海
        if (m.map) gmap = MAPS[m.map] ? m.map : "open";
        if (m.scene) { setScene(m.scene); announceScene(); }
        coop = !!m.coop; coopTarget = m.target || 0; coopTeam = 0;
        el.stage.classList.remove("fever");
        NET.players = new Map((m.players || []).map(p => [p.id, p]));
        syncHud();
        break;

      case "spawn":
        (m.items || []).forEach(netItem);
        break;

      case "despawn":
        (m.ids || []).forEach(netDrop);
        break;

      case "grabbed": {
        const mine = m.by === NET.you;
        // 爆炸对所有人可见（用服务器给的爆点，两边算出同样的结果）
        if (m.kind === "puffer" || m.kind === "mine") applyBurst(m.kind, m.x, m.y);
        const p = NET.players.get(m.by);
        if (p) p.score = m.score;
        timeLeft = m.time;
        if (mine) {
          score = m.score; combo = m.combo;
          roundStat.maxCombo = Math.max(roundStat.maxCombo, combo);
          const it = hook.catches.find(c => c.netId === m.id);
          const kind = KINDS[m.kind];
          if (kind.hazard) {                       // 扣时间已经由服务器算进 m.time
            hazardHit({ kind, id: m.kind }, hook.x, SEA_Y + 16);
            syncHud();
            break;
          }
          if (kind.power) {                        // 道具只给钓到的人（怀表的时间服务器已加）
            if (m.kind === "ink") { pop(hook.x, SEA_Y + 16, t("ink_use"), "#c6a2ff", 21); beep(520, 0.18, "square", 0.05); }
            else activatePower(m.kind, hook.x, SEA_Y + 16);
            syncHud();
            break;
          }
          pop(hook.x, SEA_Y + 16, t("pop_gain", { name: kindName(m.kind), n: m.gained }), kind.color || "#ffd24a");
          if (m.bonus > 0) {
            pop(hook.x + 70, SEA_Y + 40, `+${m.bonus}s`, "#8bf5a8", 21);
            el.timeBoard.classList.add("boost");
            clearTimeout(land.boostT);
            land.boostT = setTimeout(() => el.timeBoard.classList.remove("boost"), 700);
          }
          if (!seen.has(m.kind)) {                  // 联机也算图鉴
            seen.add(m.kind);
            newSeen.push(kindName(m.kind));
            try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen])); } catch (_) {}
            pop(hook.x, SEEN_POP_Y, t("pop_dex", { name: kindName(m.kind) }), "#9be7ff", 20);
          }
          caught[m.kind] = (caught[m.kind] || 0) + 1;
          earned[m.kind] = (earned[m.kind] || 0) + m.gained;
          if (!it) pop(hook.x, SEA_Y + 60, t("pop_won"), "#ffd24a", 19);
        } else {
          const had = hook.catches.some(c => c.netId === m.id);
          netDrop(m.id);
          if (m.kind === "ink" && !spectating) inkSplat();     // 墨囊：钓到的人糊别人
          if (had) pop(hook.x, hook.y - 30, t("pop_stolen"), "#ff9f6b", 19);
        }
        syncHud();
        break;
      }

      case "emote":
        emotes.set(m.by, { e: m.e, t: performance.now() / 1000 });
        break;

      case "hooks":
        for (const [idStr, v] of Object.entries(m.h || {})) {
          const id = +idStr;
          if (id === NET.you) continue;
          const h = NET.hooks.get(id) || { x:v[0], y:v[1], rx:v[0], ry:v[1], st:v[2], n:v[3] };
          h.x = v[0]; h.y = v[1]; h.st = v[2]; h.n = v[3];
          NET.hooks.set(id, h);
        }
        break;

      case "tick":
        timeLeft = m.time;
        specCount = m.specs || 0;
        coop = !!m.coop; coopTarget = m.target || 0; coopTeam = m.team || 0;
        if (m.fever !== fever) {
          fever = m.fever;
          bgmRate();
          el.stage.classList.toggle("fever", fever);
          if (fever) {
            pop(W / 2, SEA_Y + 90, t("pop_fever"), "#ffb35e", 27);
            [660, 830, 990, 1240].forEach((f, i) => setTimeout(() => beep(f, 0.16, "square", 0.05), i * 80));
          }
        }
        (m.players || []).forEach(p => {
          const cur = NET.players.get(p.id);
          if (cur) cur.score = p.score; else NET.players.set(p.id, p);
          if (p.id === NET.you) score = p.score;
        });
        syncHud();
        break;

      case "over":
        state = "over";
        struggle = null;
        showPane("sum");
        NET.players = new Map((m.players || []).map(p => [p.id, p]));
        showOnlineResults(m.players || []);
        break;
    }
  }

  function showOnlineResults(list, repaint) {
    const mine = list.find(p => p.id === NET.you);
    const rank = list.findIndex(p => p.id === NET.you) + 1;
    score = mine ? mine.score : score;
    if (score > best) { best = score; bests[roundTime] = best; saveBests(); }
    el.best.textContent = best;
    const entry = { sc: score, at: Date.now() };
    if (score > 0) { recordScore(score, "mp"); entry.at = ranks.find(x => x.sc === score)?.at || entry.at; }
    el.overRank.style.display = "";
    renderRanks(el.overRank, entry);
    el.overScore.textContent = t("pts", { n: score });
    el.overPlayers.style.display = "";
    el.overPlayers.innerHTML = list.map((p, i) =>
      `<span>${["🥇","🥈","🥉"][i] || (i + 1) + "."} ${p.name}${p.id === NET.you ? t("you") : ""}</span>` +
      `<span>${p.score}</span>`).join("");
    el.overTable.innerHTML = Object.keys(KINDS).filter(k => caught[k])
      .map(k => `<span>${kindName(k)} ×${caught[k]}</span><span>${t("pts", { n: earned[k] })}</span>`).join("")
      || `<span>${t("nothing_mp")}</span><span>${t("pts", { n: 0 })}</span>`;
    if (!repaint) lastGotA = checkAchievements({ mpRank: rank, mpPlayers: list.length });
    paintAchvLine();
    renderFishPane();
    el.overMiss.innerHTML = "";                   // 联机局不跑任务
    el.overDex.textContent = newSeen.length
      ? t("dex_new", { list: newSeen.join(lang === "en" ? ", " : "、"), a: seen.size, b: KIND_IDS.length })
      : t("dex_prog", { a: seen.size, b: KIND_IDS.length });
    renderDex();
    const team = list.reduce((a, p) => a + p.score, 0);
    el.overBest.textContent = coop && coopTarget > 0
      ? t(team >= coopTarget ? "coop_win" : "coop_lose", { team, target: coopTarget })
      : (list.length > 1 ? t("mp_rank", { n: list.length, r: rank }) : t("mp_alone"));
    repaintResults = () => showOnlineResults(list, true);
    el.over.classList.remove("hidden");
    if (!repaint) rank === 1 && list.length > 1 ? fanfare() : beep(300, 0.3, "sawtooth", 0.05);
  }

  function sendEmote(i) {
    if (!online || !EMOJI[i]) return;
    emotes.set(NET.you, { e:i, t: performance.now() / 1000 });   // 自己也看得到
    NET.send({ t:"emote", e:i });
  }

  function drawEmotes() {                          // 别人发的表情，飘在他的船上方
    const now = performance.now() / 1000;
    for (const [id, em] of emotes) {
      if (now - em.t > 2.2) { emotes.delete(id); continue; }
      const h = NET.hooks.get(id);
      const x = id === NET.you ? ship.x : (h ? h.rx : W / 2);
      const y = SEA_Y - 52 - (now - em.t) * 22;     // 起点在名字牌上面，别压着名字
      ctx.globalAlpha = Math.max(0, 1 - (now - em.t) / 2.2);
      ctx.font = "30px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(EMOJI[em.e] || "👍", x, y);
      ctx.globalAlpha = 1;
    }
  }

  // 联机时画别人的船、鱼线和钩子，右上角一块实时比分
  function drawRemotes() {
    for (const [id, h] of NET.hooks) {
      const col = pColor(id);
      const p   = NET.players.get(id);
      ctx.strokeStyle = col; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(h.rx, SEA_Y - 12); ctx.lineTo(h.rx, h.ry); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = col;                           // 小船
      ctx.beginPath();
      ctx.moveTo(h.rx - 15, SEA_Y - 16); ctx.lineTo(h.rx + 15, SEA_Y - 16);
      ctx.lineTo(h.rx + 9, SEA_Y - 6); ctx.lineTo(h.rx - 9, SEA_Y - 6);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(h.rx, h.ry, 4, 0, Math.PI * 2); ctx.fill();
      if (p) {                                       // 名字牌
        ctx.font = "700 12px 'Segoe UI','PingFang SC',sans-serif";
        ctx.textAlign = "center";
        const w = ctx.measureText(p.name).width + 10;
        ctx.fillStyle = "rgba(3,18,32,.55)";
        pill(h.rx - w / 2, SEA_Y - 34, w, 15, 5); ctx.fill();
        ctx.fillStyle = col;
        ctx.fillText(p.name, h.rx, SEA_Y - 23);
      }
    }
    if (NET.players.size) {                          // 实时比分板
      const list = [...NET.players.values()].sort((a, b) => b.score - a.score).slice(0, 6);
      ctx.textAlign = "right";
      ctx.font = "700 13px 'Segoe UI','PingFang SC',sans-serif";
      let y = SEA_Y + 26;
      for (const p of list) {
        const txt = `${p.name} ${p.score}`;
        const w = ctx.measureText(txt).width + 12;
        ctx.fillStyle = "rgba(3,18,32,.5)";
        pill(W - 12 - w, y - 12, w, 17, 5); ctx.fill();
        ctx.fillStyle = p.id === NET.you ? "#ffd24a" : pColor(p.id);
        ctx.fillText(txt, W - 18, y);
        y += 21;
      }
      if (specCount > 0) {
        const txt = t("watching", { n: specCount });
        const w = ctx.measureText(txt).width + 12;
        ctx.fillStyle = "rgba(3,18,32,.5)";
        pill(W - 12 - w, y - 12, w, 17, 5); ctx.fill();
        ctx.fillStyle = "#a8c8da";
        ctx.fillText(txt, W - 18, y);
      }
      ctx.textAlign = "center";
    }
  }

  // ───────────────────────── 语言切换 ─────────────────────────
  /* 静态文案统一由 data-i18n / data-ph 驱动，切换时整页重刷一遍，
     动态文字（漂浮提示、画布上的字）本来就是每帧或每次事件走 t()，不用管。 */
  function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : "en";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(n => {
      const k = n.getAttribute("data-i18n");
      if (n.tagName === "TITLE") return;
      n.innerHTML = t(k);
    });
    document.querySelectorAll("[data-ph]").forEach(n => {
      n.placeholder = t(n.getAttribute("data-ph"));
    });
    el.sound.title = t("t_sound");
    el.music.title = t("t_music");
    syncMusicBtn();
    el.lang.title  = t("t_lang");
    el.lang.textContent = lang === "zh" ? "EN" : "中";
    el.full.title = (isFs() || manualIm) ? t("t_full_exit") : t("t_full");
    refreshDaily();                                // 每日挑战说明也要换语言
    renderDex();                                   // 图鉴里的鱼名
    renderRanks(el.menuRank);                      // 排行榜表头
    if (!el.over.classList.contains("hidden") && repaintResults) repaintResults();
  }

  el.lang.addEventListener("click", e => {
    e.stopPropagation();
    lang = lang === "zh" ? "en" : "zh";
    try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
    applyLang();
  });

  // ───────────────────────── 全屏 ─────────────────────────
  /* iOS 的 iPhone Safari 至今不给普通元素全屏，所以 API 不可用或被拒时
     退回「沉浸模式」：收起标题和说明，机台顶满可视高度 —— 观感上接近全屏。 */
  let manualIm = false;

  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

  function syncImmersive() {
    const on = isFs() || manualIm;
    document.body.classList.toggle("immersive", on);
    el.full.textContent = on ? "⤢" : "⛶";
    el.full.title = on ? t("t_full_exit") : t("t_full");
    resizeCanvas();                                  // 尺寸变了就重算内部分辨率，别被拉虚
  }

  /* 这台设备到底允不允许元素全屏。iPad Safari 上 webkitRequestFullscreen 这个方法
     是存在的，但 fullscreenEnabled 可能是 false，调下去**既不报错也不进全屏** ——
     所以「方法存在」不能当成「能用」，只看 enabled 也不够，最后还得回头验一次。 */
  const fsAllowed = () => {
    if (document.fullscreenEnabled !== undefined) return !!document.fullscreenEnabled;
    if (document.webkitFullscreenEnabled !== undefined) return !!document.webkitFullscreenEnabled;
    const root = document.documentElement;
    return !!(root.requestFullscreen || root.webkitRequestFullscreen);
  };

  async function toggleFullscreen() {
    try {
      if (isFs()) {
        await (document.exitFullscreen ? document.exitFullscreen()
             : document.webkitExitFullscreen && document.webkitExitFullscreen());
        manualIm = false;
        syncImmersive();
        return;
      }
      if (manualIm) { manualIm = false; syncImmersive(); return; }   // 沉浸模式下再按一次 = 退出

      const root = document.documentElement;
      const req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (!fsAllowed() || !req) { manualIm = true; syncImmersive(); return; }

      try { await req.call(root); } catch (_) {}      // 前缀版不返回 Promise，await 也无妨
      try { await screen.orientation.lock("portrait"); } catch (_) {}   // 竖屏游戏，能锁就锁

      /* 关键的一步：等两帧看真的进去了没有。
         iPad 那种静默失败在这里会露馅 —— 露馅就退回沉浸模式，
         而不是让玩家按了按钮却什么都没发生。 */
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      if (!isFs()) manualIm = true;
    } catch (_) {
      manualIm = true;                                // 被拒（iOS / 权限）就用沉浸模式
    }
    syncImmersive();
  }

  el.full.addEventListener("click", e => { e.stopPropagation(); toggleFullscreen(); });
  document.addEventListener("fullscreenchange", syncImmersive);
  document.addEventListener("webkitfullscreenchange", syncImmersive);

  let resizePending = false;                         // 窗口尺寸变化后重算一次
  const onResize = () => {
    if (resizePending) return;
    resizePending = true;
    requestAnimationFrame(() => { resizePending = false; resizeCanvas(); });
  };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);
  // iOS 收起 / 展开地址栏时可见高度变了，但不一定发 window 的 resize
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", onResize);
    window.visualViewport.addEventListener("scroll", onResize);
  }

  // ───────────────────────── 输入 ─────────────────────────
  const canvasX = clientX => {
    const r = canvas.getBoundingClientRect();
    return (clientX - r.left) * (W / r.width);
  };

  function requestStart() {
    if (online) NET.send({ t:"ready", dur: roundTime, coop: el.mpCoop.checked });   // 联机：谁先点谁定时长 + 模式
    else startGame();
  }

  canvas.addEventListener("pointerdown", e => {
    if (locked) return;
    e.preventDefault();
    if (state === "playing" && struggle) { tapStruggle(); return; }   // 正在拉扯
    state === "playing" ? cast(canvasX(e.clientX)) : requestStart();
  });
  el.menu.addEventListener("click", startGame);
  el.over.addEventListener("click", requestStart);
  document.getElementById("btn-start").addEventListener("click", e => { e.stopPropagation(); startGame(); });
  document.getElementById("btn-again").addEventListener("click", e => { e.stopPropagation(); requestStart(); });

  // ── 局时选择 ──
  function renderDurSeg() {
    [...el.segDur.querySelectorAll("button")].forEach(b =>
      b.classList.toggle("on", +b.dataset.d === roundTime));
    el.time.textContent = Math.ceil(timeLeft);
  }
  el.segDur.addEventListener("click", e => {
    e.stopPropagation();
    const b = e.target.closest("button");
    if (!b) return;
    roundTime = +b.dataset.d;
    try { localStorage.setItem(DUR_KEY, String(roundTime)); } catch (_) {}
    best = bestOf(roundTime);                      // 最高分是分档的，换档要跟着换
    el.best.textContent = best;
    // 联机时局时由服务器定，这里只是「下一局想要多长」，不能动正在跑的倒计时
    if (!online) timeLeft = roundTime;
    renderDurSeg();
    renderRanks(el.menuRank);
    syncHud();
  });

  // ── 每日挑战 ──
  function refreshDaily() {
    if (dailyRec.date !== todayKey()) dailyRec = { date: todayKey(), best: 0, plays: 0 };
    el.daily.classList.toggle("on", daily);
    el.dailyNote.style.display = daily ? "" : "none";
    if (daily) {
      el.dailyNote.innerHTML = t("daily_note") + "<br>" +
        (dailyRec.plays ? t("daily_best", { n: dailyRec.best, p: dailyRec.plays }) : t("daily_none"));
    }
    [...el.segDur.querySelectorAll("button[data-d]")].forEach(b => {
      b.disabled = daily;                          // 每日挑战固定 60s
      b.style.opacity = daily ? .4 : 1;
    });
  }

  el.daily.addEventListener("click", e => {
    e.stopPropagation();
    daily = !daily;
    if (daily) {                                   // 固定 60s，成绩才有可比性
      roundTime = 60;
      try { localStorage.setItem(DUR_KEY, "60"); } catch (_) {}
      best = bestOf(60); el.best.textContent = best;
      timeLeft = 60; renderDurSeg(); renderRanks(el.menuRank);
    }
    refreshDaily();
    syncHud();
  });

  function saveDaily(sc) {
    if (dailyRec.date !== todayKey()) dailyRec = { date: todayKey(), best: 0, plays: 0 };
    dailyRec.plays++;
    if (sc > dailyRec.best) dailyRec.best = sc;
    try { localStorage.setItem(DAILY_KEY, JSON.stringify(dailyRec)); } catch (_) {}
  }

  /* 成绩卡片图：在离屏画布上画一张 900×560 的卡，能用系统分享就分享文件，
     否则触发下载。（沙箱里的下载会被拦，那时退回复制文字。） */
  function buildCard() {
    const c = document.createElement("canvas");
    c.width = 900; c.height = 560;
    const g = c.getContext("2d");
    const realCtx = ctx;                                     // ART 用的是全局 ctx，临时借给卡片

    const SURF = 150;                                        // 水面：压在大分数上沿之上，别横穿数字
    const sky = g.createLinearGradient(0, 0, 0, SURF);       // 天
    sky.addColorStop(0, "#0b2d4b"); sky.addColorStop(1, "#1d6a92");
    g.fillStyle = sky; g.fillRect(0, 0, 900, SURF);
    const sea = g.createLinearGradient(0, SURF, 0, 560);     // 海
    sea.addColorStop(0, "#0e6ea0"); sea.addColorStop(1, "#03203a");
    g.fillStyle = sea; g.fillRect(0, SURF, 900, 560 - SURF);
    g.strokeStyle = "rgba(230,250,255,.7)"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(0, SURF); g.lineTo(900, SURF); g.stroke();
    g.strokeStyle = "#6b3f1d"; g.lineWidth = 10;             // 机台木框
    g.strokeRect(5, 5, 890, 550);

    g.textAlign = "left";
    g.fillStyle = "#ffd24a";
    g.font = "900 34px 'Segoe UI','PingFang SC',sans-serif";
    g.fillText("🏴‍☠️ " + t("card_title"), 40, 70);
    g.fillStyle = "#cfe6f2";
    g.font = "600 19px 'Segoe UI','PingFang SC',sans-serif";
    const mode = [roundTime + "s",
                  daily ? t("card_mode_daily") : null,
                  online ? t("card_mode_mp") : null,
                  t("sc_" + scene).replace(/　.*$/, "")].filter(Boolean).join("　·　");
    g.fillText(mode + "　·　" + todayKey(), 40, 104);

    g.fillStyle = "#fff6dc";                                 // 大分数
    g.font = "900 108px 'Segoe UI',sans-serif";
    const scoreTxt = String(score);
    g.fillText(scoreTxt, 40, 240);
    const scoreW = g.measureText(scoreTxt).width;
    g.fillStyle = "#ffd24a";
    g.font = "900 30px 'Segoe UI','PingFang SC',sans-serif";
    g.fillText((t("pts", { n: "" }).trim() || "pts"), 54 + scoreW, 240);

    // 战果（最多 6 项）
    g.font = "700 20px 'Segoe UI','PingFang SC',sans-serif";
    const rows = Object.keys(KINDS).filter(k => caught[k]).sort((a, b) => KINDS[b].score - KINDS[a].score).slice(0, 6);
    rows.forEach((k, i) => {
      const x = 40 + (i % 2) * 300, y = 300 + Math.floor(i / 2) * 34;
      g.fillStyle = KINDS[k].color || KINDS[k].labelColor || "#e8f6ff";
      g.fillText(`${kindName(k)} ×${caught[k]}`, x, y);
    });

    const doneM = missions.filter(m => m.done);               // 任务与图鉴
    g.fillStyle = "#9be7ff";
    g.font = "700 18px 'Segoe UI','PingFang SC',sans-serif";
    if (!online && doneM.length) {
      const sep = lang === "en" ? ", " : "、";
      g.fillText(t("card_missions") + (lang === "en" ? ": " : "：") +
                 doneM.map(m => missionText(m.def)).join(sep).slice(0, 60), 40, 430);
    }
    g.fillStyle = "#cfe6f2";
    g.fillText(`${t("card_dex")} ${seen.size}/${KIND_IDS.length}　·　${t("achv_head", { a: achv.size, b: ACHIEVEMENTS.length })}　·　${t("card_best")} ${best}`, 40, 464);

    // 右侧画几条本局钓到的鱼当插图（鱼优先，不够就拿别的凑，别留空）
    const art = [...rows.filter(k => KINDS[k].art === "fish"),
                 ...rows.filter(k => KINDS[k].art !== "fish")].slice(0, 3);
    ctx = g;                                                 // 让 ART 画到卡片上
    art.forEach((k, i) => {
      g.save();
      g.translate(760, 250 + i * 95);
      g.scale(1.15, 1.15);
      try { ART[KINDS[k].art]({ kind: KINDS[k], id: k, t: 0, wob: 0.5, vx: 1 }); } catch (_) {}
      g.restore();
    });
    ctx = realCtx;

    g.fillStyle = "rgba(255,246,220,.55)";
    g.font = "600 16px 'Segoe UI',sans-serif";
    g.textAlign = "right";
    g.fillText(location.host + location.pathname, 860, 520);
    return c;
  }

  /* 「钓到的鱼」那一栏。缩略图不是图片文件 —— 直接拿画鱼用的那套 ART 函数
     画到一个 62×62 的小画布上，所以不增加任何外部资源，也永远和海里那条长得一样。
     ART 读的是模块级的 ctx，这里临时把它借给小画布，画完还回去（和成绩图一个套路）。 */
  function fishThumb(id) {
    const k = KINDS[id], px = 62, dpr = Math.min(2, window.devicePixelRatio || 1);
    const c = document.createElement("canvas");
    c.width = c.height = Math.round(px * dpr);
    const g = c.getContext("2d");
    const realCtx = ctx;
    ctx = g;
    try {
      g.scale(dpr, dpr);
      g.translate(px / 2, px / 2);
      // 按命中框把它缩到框里，巨兽和金币才不会一个撑爆一个小得看不见
      const sc = Math.min(px / (k.hw * 2), px / (k.hh * 2)) * 0.86;
      g.scale(sc, sc);
      ART[k.art]({ kind: k, id, t: 0, wob: 0.5, vx: 1 });
    } catch (_) {} finally { ctx = realCtx; }
    return c;
  }

  function renderFishPane() {
    const got = KIND_IDS.filter(k => caught[k]);
    el.fishList.innerHTML = "";
    if (!got.length) {
      const d = document.createElement("div");
      d.className = "fish-empty";
      d.textContent = t("fish_none");
      el.fishList.appendChild(d);
      return;
    }
    // 分数高的排前面，一眼看到这局最大的收获
    got.sort((a, b) => (KINDS[b].score || 0) - (KINDS[a].score || 0));
    for (const id of got) {
      const k = KINDS[id];
      const card = document.createElement("div");
      card.className = "fish-card";
      card.appendChild(fishThumb(id));
      const body = document.createElement("div");
      body.className = "fc-body";
      const head = document.createElement("div");
      head.className = "fc-head";
      const val = k.label != null ? k.label : t("pts", { n: earned[id] || 0 });
      head.innerHTML = `<span class="fc-n">${kindName(id)}</span>` +
                       `<span class="fc-x">${t("fish_count", { n: caught[id] })}</span>` +
                       `<span class="fc-v">${val}</span>`;
      const fact = document.createElement("div");
      fact.className = "fc-fact";
      fact.textContent = factOf(id);
      body.appendChild(head);
      body.appendChild(fact);
      card.appendChild(body);
      el.fishList.appendChild(card);
    }
  }

  function showPane(which) {
    el.paneSum.classList.toggle("hidden", which !== "sum");
    el.paneFish.classList.toggle("hidden", which !== "fish");
    [...el.overTabs.querySelectorAll("button")].forEach(b =>
      b.classList.toggle("on", b.dataset.pane === which));
    if (which === "fish") renderFishPane();
  }
  el.overTabs.addEventListener("click", e => {
    e.stopPropagation();                        // 结算页点哪都会重开一局，标签页不能被算进去
    const b = e.target.closest("button");
    if (b) showPane(b.dataset.pane);
  });

  async function shareCard() {
    const done = msg => { el.card.textContent = msg;
      setTimeout(() => el.card.textContent = t("btn_card"), 1600); };
    let blob;
    try {
      const c = buildCard();
      blob = await new Promise(res => c.toBlob(res, "image/png"));
    } catch (_) { done(t("share_failed")); return; }
    if (!blob) { done(t("share_failed")); return; }

    const file = new File([blob], "treasure-cove.png", { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: shareText() });
        done(t("card_shared")); return;
      }
    } catch (_) { /* 用户取消或不支持，走下载 */ }
    const url = URL.createObjectURL(blob);
    if (window.self !== window.top) {                // 被嵌在别人页面里：下载会被沙箱吃掉
      showCard(url);
      done(t("card_shown"));
      return;
    }
    try {
      const a = document.createElement("a");
      a.href = url; a.download = "treasure-cove-" + todayKey() + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      done(t("card_saved"));
    } catch (_) { showCard(url); done(t("card_shown")); }
  }

  // 把成绩图铺在屏幕上，附一行「长按 / 右键另存为」，点一下关掉
  function showCard(url) {
    const old = document.getElementById("card-view");
    if (old) old.remove();
    const box = document.createElement("div");
    box.id = "card-view";
    box.innerHTML = `<img src="${url}" alt=""><span>${t("card_longpress")}</span>`;
    box.addEventListener("click", e => {
      if (e.target.tagName !== "IMG") { box.remove(); URL.revokeObjectURL(url); }
    });
    document.body.appendChild(box);
  }

  // ── 分享成绩：能用系统分享就分享，否则复制到剪贴板 ──
  function shareText() {
    const sep = lang === "en" ? ", " : "、";
    const lines = [t("share_head", { n: score, d: roundTime, mp: online ? t("share_mp") : "" })];
    if (daily) lines.push(t("share_daily", { date: todayKey() }));
    const got = Object.keys(KINDS).filter(k => caught[k]);
    if (got.length) {
      lines.push(t("share_catch") + got.map(k => `${kindName(k)}×${caught[k]}`).join(sep));
    }
    const doneM = missions.filter(m => m.done);
    if (!online && doneM.length) lines.push(t("share_miss") + doneM.map(m => missionText(m.def)).join(sep));
    lines.push(t("share_dex", { a: seen.size, b: KIND_IDS.length, best }));
    lines.push(location.origin + location.pathname);
    return lines.join("\n");
  }

  el.card.addEventListener("click", e => { e.stopPropagation(); shareCard(); });

  el.share.addEventListener("click", async e => {
    e.stopPropagation();
    const text = shareText();
    const done = msg => { el.share.textContent = msg;
      setTimeout(() => el.share.textContent = t("btn_share"), 1600); };
    try {
      if (navigator.share) { await navigator.share({ text }); done(t("share_shared")); return; }
      await navigator.clipboard.writeText(text);
      done(t("share_copied"));
    } catch (_) {
      try {                                        // 老浏览器 / 没有剪贴板权限时的退路
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy");
        ta.remove();
        done(t("share_copied"));
      } catch (_) { done(t("share_failed")); }
    }
  });

  // 联机面板：别让点输入框冒泡到「点一下开始单人」
  el.mpPanel.addEventListener("click", e => e.stopPropagation());
  document.getElementById("btn-online").addEventListener("click", e => { e.stopPropagation(); goOnline(); });
  el.mpRoom.addEventListener("keydown", e => { if (e.key === "Enter") { e.stopPropagation(); goOnline(); } });
  el.mpUrl.addEventListener("keydown", e => { if (e.key === "Enter") { e.stopPropagation(); goOnline(); } });
  el.mpName.addEventListener("keydown", e => { if (e.key === "Enter") { e.stopPropagation(); goOnline(); } });

  // 记住上次的服务器地址；链接里也能带 ?server=…&room=…&name=…
  {
    const q = new URLSearchParams(location.search);
    try { el.mpUrl.value = q.get("server") || localStorage.getItem(NET_KEY) || DEFAULT_SERVER; }
    catch (_) { el.mpUrl.value = DEFAULT_SERVER; }
    try { el.mpName.value = q.get("name") || localStorage.getItem(NAME_KEY) || ""; } catch (_) {}
    if (q.get("room")) el.mpRoom.value = q.get("room").toUpperCase();
    if (q.get("spec") === "1") el.mpSpec.checked = true;   // 观战链接：…&room=ABCD&spec=1

    if (q.get("room") && el.mpUrl.value) goOnline();      // 分享链接点开就直接进房（server 可省略）
  }
  function syncMusicBtn() {
    el.music.textContent = "🎵";
    el.music.style.opacity = BGM.on ? 1 : 0.45;
  }
  el.music.addEventListener("click", e => {
    e.stopPropagation();
    BGM.on = !BGM.on;
    try { localStorage.setItem(MUSIC_KEY, BGM.on ? "1" : "0"); } catch (_) {}
    BGM.on ? bgmStart() : bgmStop();
    syncMusicBtn();
  });
  // 浏览器要等用户先动一下才让出声：开关记住了，第一次交互时补上
  ["pointerdown", "keydown"].forEach(ev => {
    const once = () => { window.removeEventListener(ev, once); if (BGM.on && !bgmPlaying()) bgmStart(); };
    window.addEventListener(ev, once);
  });

  el.sound.addEventListener("click", e => {
    e.stopPropagation();
    soundOn = !soundOn;
    el.sound.textContent = soundOn ? "🔊" : "🔇";
  });
  window.addEventListener("keydown", e => {
    if (locked) return;                              // 锁屏时快捷键全部不响应
    if (e.key === "f" || e.key === "F") {            // F 切全屏
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      e.preventDefault();
      toggleFullscreen();
      return;
    }
    if (online && e.key >= "1" && e.key <= "4") {     // 1~4 发快捷表情
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      sendEmote(+e.key - 1);
      return;
    }
    if (e.code !== "Space" && e.code !== "Enter") return;
    e.preventDefault();
    if (state === "playing" && struggle) { tapStruggle(); return; }
    state === "playing" ? cast(hook.x + rand(-120, 120)) : requestStart();
  });

  /* ───────────────────────── 锁屏 ─────────────────────────
     一道简单的门，不是安全措施 —— 密码就写在这个文件里，看网页源码就能拿到。
     用途是「不知道密码的人打不开来玩」，别拿它挡真想进来的人。
     解锁记在 sessionStorage：这一次浏览器会话里不用反复输，整个浏览器关掉就重新锁上。 */
  const LOCK_PW  = "fish@123";
  const LOCK_KEY = "treasureCove.unlocked.v1";
  let locked = false;

  function lockScreen() {
    locked = true;
    try { sessionStorage.removeItem(LOCK_KEY); } catch (_) {}
    // 联机时锁屏就退出房间：本地世界冻住而服务器还在跑，留着只会解锁后满屏错位
    if (online && NET.ws) { try { NET.ws.close(); } catch (_) {} }
    el.lockBad.textContent = "";
    el.lockPw.value = "";
    el.lock.classList.remove("hidden");
    el.lockBtn.style.opacity = 1;
    bgmStop();
    try { el.lockPw.focus(); } catch (_) {}
  }

  function tryUnlock() {
    if (el.lockPw.value === LOCK_PW) {
      locked = false;
      try { sessionStorage.setItem(LOCK_KEY, "1"); } catch (_) {}
      el.lock.classList.add("hidden");
      el.lockPw.value = "";
      el.lockBad.textContent = "";
      el.lockBtn.style.opacity = 0.55;
      last = performance.now();                    // 别把锁着的这段时间算成一帧
      if (BGM.on) bgmStart();
      beep(880, 0.12, "triangle", 0.05);
      setTimeout(() => beep(1170, 0.14, "triangle", 0.05), 90);
      return true;
    }
    el.lockBad.textContent = t("lock_bad");
    el.lockPw.value = "";
    el.lock.classList.remove("shake");
    void el.lock.offsetWidth;                      // 重置动画，连错两次也能再抖一下
    el.lock.classList.add("shake");
    beep(160, 0.16, "sawtooth", 0.05);
    try { el.lockPw.focus(); } catch (_) {}
    return false;
  }

  el.lockBtn.addEventListener("click", e => { e.stopPropagation(); lockScreen(); });
  document.getElementById("lock-go").addEventListener("click", e => { e.stopPropagation(); tryUnlock(); });
  el.lockPw.addEventListener("keydown", e => {
    e.stopPropagation();                           // 别让空格/回车漏到放钩那边去
    if (e.key === "Enter") tryUnlock();
  });
  el.lock.addEventListener("click", e => e.stopPropagation());

  function initLock() {
    let was = null;
    try { was = sessionStorage.getItem(LOCK_KEY); } catch (_) {}
    if (was === "1") { locked = false; el.lock.classList.add("hidden"); el.lockBtn.style.opacity = 0.55; }
    else lockScreen();
  }

  // ───────────────────────── 主循环 ─────────────────────────
  let last = performance.now(), lastDt = 0.016;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; lastDt = dt;
    if (!locked) update(dt);                       // 锁屏时世界冻住，倒计时也不走
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);        // 逻辑坐标 → 物理像素
    if (shakeT > 0) {                              // 水雷炸一下
      shakeT = Math.max(0, shakeT - dt);
      const k = shakeT * 60;
      ctx.translate(rand(-k, k), rand(-k, k));
    }
    draw();
    requestAnimationFrame(loop);
  }

  resizeCanvas();                    // 放这里：它要读 online / items，那些在上面是 let 声明
  applyLang();
  refreshDaily();
  renderDurSeg();
  resetGame();                       // 菜单背景也有鱼在游
  initLock();                        // 放最后：锁屏要用到 el / t() / bgm
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
