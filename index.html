<!DOCTYPE html>
<html lang="zh-Hans" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">宝藏海湾 · 钓鱼机</title>
<style>
  :root{
    --ink:#fff6dc;
    --wood:#6b3f1d;
    --wood2:#8b5424;
    --parch:#f4dfa8;
    --gold:#ffd24a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 600px at 50% 0%,#12496f 0%,#04121f 65%),
      #04121f;
    color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:10px 10px 22px;
  }

  /* 竖屏机台比例 600 : 980 */
  .wrap{width:min(96vw, calc(84vh * 0.6122));}

  .title{
    display:flex;align-items:baseline;gap:10px;justify-content:center;
    margin:2px 0 8px;
  }
  .title h1{
    margin:0;font-size:clamp(1.1rem,3.4vw,1.5rem);letter-spacing:1px;
    color:var(--gold);text-shadow:0 2px 0 #7a4a00,0 0 18px rgba(255,210,74,.35);
  }
  .title span{font-size:.78rem;color:#9dc2d8}

  /* ── 街机 HUD：木牌 + 羊皮纸 ── */
  .hud{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin-bottom:8px}
  .board{
    flex:1 1 20%;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;
    background:linear-gradient(180deg,var(--wood2),var(--wood));
    border:2px solid #3f230c;border-radius:10px;padding:6px 8px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 4px 10px rgba(0,0,0,.4);
  }
  .board .lbl{
    font-size:.68rem;letter-spacing:1.5px;color:#f0cd8f;
    text-transform:uppercase;white-space:nowrap;
  }
  .board .val{
    background:var(--parch);color:#5a3a10;border-radius:6px;
    padding:2px 8px;font-weight:800;font-variant-numeric:tabular-nums;
    min-width:2.8em;text-align:center;font-size:clamp(.9rem,2.6vw,1.05rem);
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);
  }
  .board.warn .val{background:#ffb1a6;color:#6d1b12}
  .board.boost .val{background:#8bf5a8;color:#0d4a23}   /* 时间奖励闪一下 */
  .icon-btn{
    flex:0 0 auto;min-width:0;
    background:linear-gradient(180deg,var(--wood2),var(--wood));
    border:2px solid #3f230c;color:var(--ink);border-radius:10px;
    padding:6px 9px;font-size:.86rem;cursor:pointer;line-height:1;white-space:nowrap;
  }

  .stage{
    position:relative;border-radius:14px;overflow:hidden;
    border:3px solid #2a1608;
    box-shadow:0 0 0 3px #6b3f1d,0 18px 46px rgba(0,0,0,.55);
  }
  canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:10px;text-align:center;
    background:rgba(3,16,28,.76);backdrop-filter:blur(2px);
    cursor:pointer;padding:18px;overflow:auto;
  }
  /* 内容比机台还高时（iPad 横屏、矮窗口），justify-content:center 会把顶部裁掉
     而且滚不上去 —— flexbox 的老毛病。用两个可压缩的伪元素当弹簧：
     有余量就把内容顶到正中间，没余量就缩成 0，内容从顶部开始、能正常滚。 */
  .overlay::before, .overlay::after{content:"";flex:1 1 0;min-height:0}
  .overlay.hidden{display:none}
  .banner{
    background:linear-gradient(180deg,#ff6b4a,#d8341c);
    border:3px solid #ffd24a;border-radius:12px;padding:8px 22px;
    font-size:clamp(1.05rem,3.8vw,1.5rem);font-weight:900;letter-spacing:1px;
    text-shadow:0 2px 0 rgba(0,0,0,.35);
    transform:rotate(-1.5deg);
  }
  .big{
    font-size:clamp(2.2rem,10vw,3.4rem);font-weight:900;color:var(--gold);
    text-shadow:0 3px 0 #8a5000,0 0 24px rgba(255,210,74,.45);line-height:1
  }
  .overlay p{margin:0;color:#bfdcec;font-size:.84rem;line-height:1.65;max-width:27em}
  .cta{
    margin-top:2px;background:linear-gradient(180deg,#ffd85e,#f0a422);
    color:#4a2a00;font-weight:900;border:3px solid #8a5000;border-radius:999px;
    padding:12px 30px;font-size:1.02rem;cursor:pointer;letter-spacing:1px;
    box-shadow:0 8px 22px rgba(240,164,34,.4);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{50%{transform:scale(1.05)}}
  @media (prefers-reduced-motion: reduce){ .cta{animation:none} }

  /* 价目表：窄屏 1 组/行，宽屏 2 组/行 */
  .price{
    display:grid;grid-template-columns:auto auto;gap:2px 14px;
    background:rgba(0,0,0,.34);border:1px solid rgba(255,210,74,.35);
    border-radius:10px;padding:9px 14px;font-size:.78rem;
  }
  .price span:nth-child(even){text-align:right;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
  @media (min-width:430px){ .price.wide{grid-template-columns:auto auto auto auto} }
  .tip{color:#8fb6cf;font-size:.78rem;margin-top:8px;text-align:center;line-height:1.6}

  /* 结算页的标签页 */
  .tabs{display:flex;gap:6px;margin:2px 0 4px}
  .tabs button{
    background:rgba(0,0,0,.3);border:2px solid rgba(255,210,74,.35);color:#cfe6f2;
    border-radius:9px 9px 0 0;padding:6px 14px;font-size:.8rem;font-weight:700;cursor:pointer;
  }
  .tabs button.on{background:linear-gradient(180deg,var(--wood2),var(--wood));
    border-color:#3f230c;color:var(--ink)}
  .pane.hidden{display:none}
  .pane{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}

  /* 本局钓到的鱼：缩略图 + 名字 + 冷知识 */
  .fish-list{
    display:flex;flex-direction:column;gap:8px;width:min(100%,34em);
    max-height:46vh;overflow-y:auto;padding-right:4px;
  }
  .fish-card{
    display:flex;gap:11px;align-items:flex-start;text-align:left;
    background:rgba(0,0,0,.34);border:1px solid rgba(255,210,74,.3);
    border-radius:10px;padding:9px 11px;
  }
  .fish-card canvas{
    flex:0 0 auto;width:62px;height:62px;border-radius:8px;
    background:linear-gradient(180deg,rgba(20,90,130,.5),rgba(4,30,52,.6));
  }
  .fish-card .fc-body{min-width:0;flex:1 1 auto}
  .fish-card .fc-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.86rem;font-weight:800}
  .fish-card .fc-n{color:#e8f6ff}
  .fish-card .fc-v{color:var(--gold);font-variant-numeric:tabular-nums}
  .fish-card .fc-x{color:#9be7ff;font-size:.78rem}
  .fish-card .fc-fact{color:#a8c8da;font-size:.76rem;line-height:1.55;margin-top:3px}
  .fish-empty{color:#a8c8da;font-size:.8rem}

  /* 全屏（或不支持全屏 API 时的沉浸模式）：收起标题和说明，
     用 flex 让画布吃掉 HUD 之外的全部高度 —— 不要按 vh 算高度再祈祷放得下，
     那样 HUD 一换行就会把机台顶出屏幕。 */
  /* iOS / iPadOS 的 100vh 是「不含工具栏」的那个大高度，直接用会把机台底部顶出屏幕。
     dvh 才是当前真正可见的高度；不认识 dvh 的浏览器会忽略后一行，退回 vh。 */
  body.immersive{padding:0;height:100vh;overflow:hidden;justify-content:flex-start}
  body.immersive{height:100dvh}
  body.immersive .title,
  body.immersive .tip{display:none}
  body.immersive .wrap{
    width:100vw;max-width:100vw;height:100vh;
    display:flex;flex-direction:column;gap:4px;padding:5px;
  }
  body.immersive .wrap{height:100dvh}
  body.immersive .hud{flex:0 0 auto;flex-wrap:nowrap;margin:0;align-self:center;justify-content:center}
  body.immersive .board{max-width:230px}
  body.immersive .board{padding:4px 6px}
  body.immersive .board .lbl{font-size:.62rem;letter-spacing:1px}
  body.immersive .stage{
    flex:1 1 auto;min-height:0;width:auto;align-self:center;max-width:100%;
    border-width:2px;box-shadow:0 0 0 2px #6b3f1d;
  }
  body.immersive canvas{height:100%;width:auto;max-width:100%}

  /* FEVER：机框发烫 */
  .stage.fever{
    box-shadow:0 0 0 3px #ff9b3d,0 0 34px rgba(255,140,50,.6),0 18px 46px rgba(0,0,0,.55);
    animation:hot .9s ease-in-out infinite;
  }
  @keyframes hot{50%{box-shadow:0 0 0 3px #ffd24a,0 0 46px rgba(255,180,70,.8),0 18px 46px rgba(0,0,0,.55)}}
  @media (prefers-reduced-motion: reduce){ .stage.fever{animation:none} }

  /* 图鉴：没钓到过的暗着 */
  .dex-head{font-size:.82rem;color:#cfe6f2;letter-spacing:1px}
  .dex-head b{color:var(--gold)}
  .price span.locked{opacity:.38}

  /* 联机面板 */
  .mp{display:flex;flex-direction:column;gap:6px;width:min(100%,23em)}
  .mp-row{display:flex;gap:6px}
  .mp input{
    flex:1;min-width:0;background:rgba(255,255,255,.92);color:#33270f;
    border:2px solid #8a5000;border-radius:8px;padding:8px 10px;font-size:.86rem;
    font-family:inherit;
  }
  .mp input::placeholder{color:#8a7a5c}
  .mp-btn{
    background:linear-gradient(180deg,#7fd3ff,#2b8fd0);color:#04212f;font-weight:900;
    border:2px solid #14577e;border-radius:8px;padding:8px 14px;font-size:.86rem;
    cursor:pointer;white-space:nowrap;
  }
  .mp-btn:hover{filter:brightness(1.08)}
  .mp-note{font-size:.74rem;color:#a8c8da;line-height:1.5}
  .mp-note.err{color:#ffb1a6}
  .mp-note.ok{color:#8bf5a8}
  /* 锁屏：盖住整台机台，压在所有其它层之上 */
  #lock{
    position:absolute;inset:0;z-index:80;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(180deg,rgba(3,20,36,.94),rgba(2,10,20,.97));
    backdrop-filter:blur(4px);padding:20px;text-align:center;
  }
  #lock.hidden{display:none}
  #lock .lk-ico{font-size:3rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  #lock .lk-title{font-size:1.15rem;font-weight:900;color:var(--gold)}
  #lock .lk-sub{font-size:.82rem;color:#a8c8da;max-width:22em;line-height:1.6}
  #lock .lk-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #lock input{
    background:var(--parch);border:2px solid #8b6b2a;border-radius:8px;
    padding:9px 12px;font-size:.95rem;color:#3b2a10;width:min(15em,60vw);
    text-align:center;letter-spacing:.06em;
  }
  #lock .lk-bad{color:#ffb1a6;font-size:.82rem;min-height:1.2em}
  #lock.shake{animation:lkShake .32s}
  @keyframes lkShake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)} 40%{transform:translateX(8px)}
    60%{transform:translateX(-5px)} 80%{transform:translateX(4px)}
  }
  #card-view{
    position:fixed;inset:0;z-index:60;background:rgba(2,10,18,.88);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;
  }
  #card-view img{max-width:96vw;max-height:78vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6);cursor:default}
  #card-view span{font-size:.86rem;color:#cfe6f2;text-align:center}
  .mp-check{display:flex;align-items:center;gap:6px;font-size:.78rem;color:#cfe6f2;cursor:pointer}
  .mp-check input{width:15px;height:15px;flex:0 0 auto}

  /* 局时选择 */
  .seg{display:flex;gap:6px;align-items:center;font-size:.8rem;color:#cfe6f2}
  .seg button{
    background:rgba(0,0,0,.34);border:2px solid #8a5000;color:var(--ink);
    border-radius:8px;padding:5px 13px;font-size:.84rem;font-weight:800;cursor:pointer;
    font-family:inherit;
  }
  .seg button.on{background:linear-gradient(180deg,#ffd85e,#f0a422);color:#4a2a00;border-color:#8a5000}

  /* 排行榜 */
  .rank{
    display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;
    background:rgba(0,0,0,.3);border:1px solid rgba(255,210,74,.28);
    border-radius:10px;padding:8px 13px;font-size:.78rem;min-width:15em;
  }
  .rank .r-sc{text-align:right;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
  .rank .r-me{color:#9be7ff}
  .rank .r-hd{grid-column:1/-1;color:#a8c8da;font-size:.74rem;letter-spacing:1px}
  .share{
    background:linear-gradient(180deg,#9be7ff,#3aa6d8);color:#03212f;font-weight:900;
    border:2px solid #1d6a90;border-radius:999px;padding:9px 20px;font-size:.88rem;cursor:pointer;
    font-family:inherit;
  }
  .share:hover{filter:brightness(1.08)}
</style>
</head>
<body>

<div class="wrap">
  <div class="title">
    <h1 data-i18n="h1">🏴‍☠️ 宝藏海湾 · 钓鱼机</h1>
    <span data-i18n="sub">Treasure Cove</span>
  </div>

  <div class="hud">
    <div class="board" id="board-time"><span class="lbl" data-i18n="lbl_time">Time</span><span class="val" id="hud-time">60</span></div>
    <div class="board"><span class="lbl" data-i18n="lbl_score">分数</span><span class="val" id="hud-score">0</span></div>
    <div class="board"><span class="lbl" data-i18n="lbl_best">Best</span><span class="val" id="hud-best">0</span></div>
    <button class="icon-btn" id="btn-lang" title="切换语言">中/EN</button>
    <button class="icon-btn" id="btn-music" title="背景音乐开关">🎵</button>
    <button class="icon-btn" id="btn-sound" title="音效开关">🔊</button>
    <button class="icon-btn" id="btn-full" title="全屏（F）">⛶</button>
    <button class="icon-btn" id="btn-lock" title="锁屏">🔒</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="600" height="980"></canvas>

    <div id="lock" class="hidden">
      <div class="lk-ico">🔒</div>
      <div class="lk-title" data-i18n="lock_title">已锁屏</div>
      <div class="lk-sub" data-i18n="lock_sub">输入密码继续钓鱼</div>
      <div class="lk-row">
        <input id="lock-pw" type="password" data-ph="lock_ph" autocomplete="off"
               autocapitalize="off" spellcheck="false" inputmode="text">
        <button class="mp-btn" id="lock-go" data-i18n="lock_btn">解锁</button>
      </div>
      <div class="lk-bad" id="lock-bad"></div>
    </div>

    <div class="overlay" id="overlay-menu">
      <div class="banner" data-i18n="banner_start">点一下就开钓！</div>
      <p data-i18n="how"></p>
      <div class="dex-head"><span id="achv-head"></span></div>
      <div class="dex-head"><span data-i18n="dex_label">图鉴</span> <b id="dex-count">0 / 15</b>　<span style="opacity:.7" data-i18n="dex_hint">钓到过的会亮起来</span></div>
      <div class="seg" id="seg-dur"><span data-i18n="seg_dur">局时</span>
        <button data-d="30">30s</button><button data-d="60">60s</button><button data-d="120">120s</button>
        <button id="btn-daily" data-i18n="daily_btn">每日挑战</button>
      </div>
      <div class="mp-note" id="daily-note" style="display:none"></div>
      <div class="price wide" id="menu-price"></div>
      <div class="rank" id="menu-rank"></div>
      <button class="cta" id="btn-start" data-i18n="btn_start">单人开钓</button>
      <div class="mp" id="mp-panel">
        <div class="mp-row">
          <input id="mp-room" data-ph="ph_room" maxlength="12" autocomplete="off">
          <button class="mp-btn" id="btn-online" data-i18n="btn_online">联机开钓</button>
        </div>
        <div class="mp-row">
          <input id="mp-name" data-ph="ph_name" maxlength="12" autocomplete="off">
          <input id="mp-url" data-ph="ph_url" autocomplete="off">
        </div>
        <label class="mp-check"><input type="checkbox" id="mp-spec"><span data-i18n="spec_label">观战模式（只看不钓）</span></label>
        <label class="mp-check"><input type="checkbox" id="mp-coop"><span data-i18n="coop_label">合作模式（全队共用目标分）</span></label>
        <div class="mp-note" id="mp-note" data-i18n="mp_note"></div>
      </div>
    </div>

    <div class="overlay hidden" id="overlay-over">
      <div class="banner" data-i18n="banner_got">YOU GOT</div>
      <div class="big" id="over-score">0</div>
      <div class="tabs" id="over-tabs">
        <button class="on" data-pane="sum" data-i18n="tab_sum">战果</button>
        <button data-pane="fish" data-i18n="tab_fish">钓到的鱼</button>
      </div>
      <div class="pane" id="pane-sum">
        <div class="price" id="over-players" style="display:none"></div>
        <div class="price" id="over-table"></div>
        <p id="over-miss"></p>
        <p id="over-achv"></p>
        <p id="over-dex"></p>
        <p id="over-best"></p>
        <div class="rank" id="over-rank"></div>
      </div>
      <div class="pane hidden" id="pane-fish">
        <div class="fish-list" id="fish-list"></div>
      </div>
      <button class="share" id="btn-share" data-i18n="btn_share">复制 / 分享成绩</button>
      <button class="share" id="btn-card" data-i18n="btn_card">保存成绩图</button>
      <button class="cta" id="btn-again" data-i18n="btn_again">再钓一次</button>
    </div>
  </div>

  <p class="tip"><span data-i18n="tip1"></span><br><span data-i18n="tip2"></span><br><span data-i18n="tip3"></span>　·　<span data-i18n="emote_tip"></span></p>
</div>

<script>
(() => {
  "use strict";

  // ───────────────────────── 场地 ─────────────────────────
  const canvas = document.getElementById("game");
  let   ctx    = canvas.getContext("2d");
  /* 逻辑坐标系：高度固定 980，宽度可变 ——
     全屏时按可用区域的宽高比把海面加宽，好把屏幕填满（不再是两边一片黑）。
     联机时强制回到 BASE_W：所有人必须是同一片海才公平，服务器也是按 600 宽发坐标的。 */
  const BASE_W = 600, MAX_W = 2200, H = 980;
  let W = BASE_W;
  const widthScale = () => W / BASE_W;           // 海面比标准宽多少倍
  /* 按「实际显示多大」× 屏幕像素密度决定内部分辨率，否则就是把 600×980 拉大 ——
     手机和高分屏上会发虚，全屏后更明显。上限 3 倍，免得大屏上填太多像素。 */
  let DPR = 1;
  const hudEl = document.querySelector(".hud");
  const PIXEL_BUDGET = 6.2e6;                    // 内部分辨率上限，宽屏时别把填充量拉爆

  function desiredW() {
    if (online) return BASE_W;                   // 联机：同一片海
    if (!document.body.classList.contains("immersive")) return BASE_W;
    const availH = Math.max(240, window.innerHeight - hudEl.offsetHeight - 18);
    const aspect = window.innerWidth / availH;
    return Math.round(Math.min(MAX_W, Math.max(BASE_W, H * aspect)));
  }

  // 宽度变了，海里的东西按比例挪，别让鱼群瞬移
  function rescaleWorld(k) {
    for (const it of items)   it.x *= k;
    for (const b of bubbles)  b.x *= k;
    for (const sp of sparks)  sp.x *= k;
    for (const pp of pops)    pp.x *= k;
    for (const c of hook.catches) c.x *= k;
    hook.x *= k;
    ship.x *= k; ship.tipX *= k;
  }

  function resizeCanvas() {
    const want = desiredW();
    if (want !== W) { rescaleWorld(want / W); W = want; }

    const rect = canvas.getBoundingClientRect();
    // 全屏时画布高度由 flex 决定、宽度随逻辑比例走，所以从高度反推显示宽度
    const cssH = rect.height || H;
    const cssW = document.body.classList.contains("immersive") ? cssH * (W / H) : (rect.width || W);
    const cap  = Math.min(3, Math.sqrt(PIXEL_BUDGET / (W * H)));
    DPR = Math.min(cap, Math.max(1, (window.devicePixelRatio || 1) * (cssW / W)));
    canvas.width  = Math.round(W * DPR);

     每日挑战时把它换成按日期播种的伪随机 —— 同一天所有人就是同一片海。
     装饰性的随机不能混进这条流，否则两台机器帧数一差，鱼群就跑偏了。 */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function seedFromString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  let audio = null;
  function beep(freq, dur = 0.12, type = "square", gain = 0.05) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      const osc = audio.createOscillator(), g = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.55), t + dur);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g).connect(audio.destination);
      osc.start(t); osc.stop(t + dur);
    } catch (_) {}
  }
  /* 背景音乐：WebAudio 现场合成一段循环的海盗小调（不引任何外部文件，保持单文件）。
     两个声部：三角波旋律 + 方波低音，各自按拍推进；FEVER 时整体加快 15%。
     浏览器在用户操作前不让出声，所以只在点过按钮 / 点过画面之后才真正开始。 */
  const MUSIC_KEY = "treasureCove.music.v1";
  /* 背景曲：Aetheric —「Snap Crackle」（Free To Use / freetouse.com）。
     文件只在玩家真的打开音乐时才去下载 —— 不开音乐的人一个字节都不用付。
     加载失败（离线、404、被 CSP 拦掉）就自动退回下面那段现场合成的小调，音乐不会哑掉。
     打包成 Artifact 那种单文件页面时，构建脚本会把这里换成 data: URI。 */
  const BGM_SRC   = "assets/bgm.mp3";
  const BGM_TRACK = { title:"Snap Crackle", artist:"Aetheric", from:"freetouse.com" };
  const MEL  = [[69,1],[74,1],[72,.5],[70,.5],[69,1],[67,1],[65,1],[67,1],
                [69,1],[70,1],[72,1],[70,1],[69,1],[67,1],[65,3]];
  const BASS = [[38,2],[38,2],[45,2],[45,2],[46,2],[46,2],[45,1],[43,1],[45,2]];
  const BGM = { on:false, timer:null, mi:0, mt:0, bi:0, bt:0, gain:null,
                el:null, synth:false };      // el = <audio>；synth = 退回合成小调
  try { BGM.on = localStorage.getItem(MUSIC_KEY) === "1"; } catch (_) {}

  const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);

  function bgmNote(n, at, dur, type, vol) {
    const osc = audio.createOscillator(), g = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(midiHz(n), at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(vol, at + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(g).connect(BGM.gain);
    osc.start(at); osc.stop(at + dur + 0.05);
  }

  function bgmSchedule() {
    if (!BGM.on || !audio || !BGM.gain) return;
    const spb = 60 / (104 * (fever ? 1.15 : 1));       // 每拍秒数，FEVER 提速
    const look = audio.currentTime + 0.35;
    while (BGM.mt < look) {
      const [n, b] = MEL[BGM.mi % MEL.length];
      bgmNote(n, BGM.mt, b * spb * 0.9, "triangle", 0.045);
      BGM.mt += b * spb; BGM.mi++;
    }
    while (BGM.bt < look) {
      const [n, b] = BASS[BGM.bi % BASS.length];
      bgmNote(n, BGM.bt, b * spb * 0.95, "square", 0.022);
      BGM.bt += b * spb; BGM.bi++;
    }
  }

  function bgmStart() {
    if (!BGM.on) return;
    if (BGM_SRC && !BGM.synth) { bgmFile(); return; }
    bgmSynthStart();
  }

  /* mp3 那条路。浏览器在用户操作过之前不给放，play() 会 reject —— 那不是错误，
     等下一次交互再试就好，所以只在「确实加载不出来」时才退回合成。 */
  function bgmFile() {
    try {
      if (!BGM.el) {
        BGM.el = new Audio();
        BGM.el.src = BGM_SRC;
        BGM.el.loop = true;
        BGM.el.volume = 0.42;                    // 别压过音效
        BGM.el.preload = "auto";
        BGM.el.addEventListener("error", () => { // 文件真的取不到 → 换合成
          BGM.el = null;
          BGM.synth = true;
          if (BGM.on) bgmSynthStart();
        });
      }
      bgmRate();
      const pr = BGM.el.play();
      if (pr && pr.catch) pr.catch(() => {});    // 还没有用户手势，等下次
    } catch (_) { BGM.synth = true; bgmSynthStart(); }
  }

  function bgmRate() {                            // FEVER 时曲子跟着快一点
    if (!BGM.el) return;
    try { BGM.el.playbackRate = fever ? 1.12 : 1; } catch (_) {}
  }

  function bgmSynthStart() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      if (!BGM.gain) {
        BGM.gain = audio.createGain();
        BGM.gain.connect(audio.destination);
      }
      BGM.gain.gain.value = 0.9;
      BGM.mt = BGM.bt = audio.currentTime + 0.15;
      BGM.mi = BGM.bi = 0;
      clearInterval(BGM.timer);
      BGM.timer = setInterval(bgmSchedule, 120);
      bgmSchedule();
    } catch (_) {}
  }

  function bgmStop() {
    clearInterval(BGM.timer);
    BGM.timer = null;
    if (BGM.gain) try { BGM.gain.gain.value = 0; } catch (_) {}
    if (BGM.el) try { BGM.el.pause(); } catch (_) {}
  }

  const bgmPlaying = () => !!BGM.timer || !!(BGM.el && !BGM.el.paused);

  function fanfare() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.13, "triangle", 0.05), i * 90));
  }

  // ───────────────────────── 生成 ─────────────────────────
  function spawn(id) {
    const k   = KINDS[id];
    const dir = gRnd() < 0.5 ? 1 : -1;
    const sp  = { coin:[12,28], swim:[24,64], drift:[6,14], paddle:[16,28],
                  jet:[26,46], crawl:[26,44], rise:[8,16], hunt:[32,52] }[k.move] || [20, 50];
    // 鲸鱼是庞然大物，慢慢巡游才有分量；龙虾比螃蟹稳一点
    const spd = id === "whale" ? [14, 22] : id === "lobster" ? [18, 30] : sp;
    const it = {
      id, kind:k, dir,
      x: dir === 1 ? -k.hw * 2 : W + k.hw * 2,
      y: k.move === "crawl" ? FLOOR_Y - 14 : TOP + grand(k.depth[0], k.depth[1]) * SPAN,
      vx: grand(spd[0], spd[1]) * dir,
      wob: Math.random() * Math.PI * 2,
      t: 0,
      // 会游出画面的自然离场；漂着不动的给个寿命，免得海里越堆越满
      // 会游出画面的自然离场；漂着不动的、以及会掉头追猎物的给个寿命，免得海里越堆越满
      life: ["coin", "drift", "rise", "crawl"].includes(k.move) ? grand(13, 20)
          : k.move === "hunt" ? grand(24, 34) : Infinity,
      dart: 0,
      meals: 0, chomp: 0,                            // 吃了几条 / 咬合动画计时
    };
    // 小鱼常常成群出现
    if ((id === "small" || id === "clown") && gRnd() < 0.55) {
      for (let i = 1; i <= 2; i++) {
        items.push(Object.assign({}, it, {
          x: it.x - it.dir * i * rand(34, 52),
          y: clamp(it.y + rand(-20, 20), TOP, FLOOR_Y - 20),
          wob: Math.random() * Math.PI * 2,
        }));
      }
    }
    items.push(it);
    return it;
  }

  /** 鱼阵：一队同深度、同速度的小鱼排成一列 —— 专门制造「一钩串满」的时刻 */
  function spawnSchool() {
    const id  = gRnd() < 0.5 ? "small" : "clown";
    const k   = KINDS[id];
    const dir = gRnd() < 0.5 ? 1 : -1;
    const n   = Math.round(grand(9, 14));
    const y   = TOP + grand(0.15, 0.55) * SPAN;
    const vx  = grand(38, 58) * dir;
    const gap = grand(38, 52);
    for (let i = 0; i < n; i++) {
      items.push({
        id, kind: k, dir, x: (dir === 1 ? -40 : W + 40) - dir * i * gap,
        y: y + Math.sin(i * 0.9) * 12, vx,
        wob: i * 0.5, t: 0, life: Infinity, dart: 0, stun: 0,
      });
    }
    pop(W / 2, SEA_Y + 150, t("school"), "#7fd3ff", 19);
  }

  function spawnRandom() {
    const total = POOL.reduce((a, k) => a + weightOf(k), 0);
    let r = gRnd() * total, id = null;
    for (const k of POOL) { if ((r -= weightOf(k)) <= 0) { id = k; break; } }
    if (!id) id = POOL.find(k => weightOf(k) > 0) || POOL[0];   // 极端情况兜底
    spawn(id);
  }

  function pop(x, y, text, color, size = 22) { pops.push({ x, y, text, color, size, t: 0 }); }
  function splash(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      sparks.push({ x, y, vx: rand(-110, 110), vy: rand(-190, -50),
                    t: 0, life: rand(0.4, 0.9), color });
    }
  }

  // ───────────────────────── 一局 ─────────────────────────
  function setScene(id) {
    scene = SCENES[id] ? id : "day";
    boltT = 0; boltNext = rand(3, 8);
    buildBackground();                             // 配色变了，背景要重烘
  }

  function setMap(id) {
    gmap = MAPS[id] ? id : "open";
    buildBackground();                             // 海水配色和海底装饰都跟着换
  }

  function pickMap() {
    const total = MAP_IDS.reduce((a, k) => a + MAPS[k].w, 0);
    let r = grand(0, total);
    for (const k of MAP_IDS) { if ((r -= MAPS[k].w) <= 0) return k; }
    return "open";
  }

  function pickScene() {
    const total = SCENE_IDS.reduce((a, k) => a + SCENES[k].w, 0);
    let r = grand(0, total);
    for (const k of SCENE_IDS) { if ((r -= SCENES[k].w) <= 0) return k; }
    return "day";
  }

  function resetGame() {
    score = 0; timeLeft = roundTime; combo = 0; caught = {}; earned = {}; newSeen = [];
    items = []; pops = []; sparks = [];
    hook = { state:"idle", x:W/2, y:SEA_Y, catches:[], pull:0 };
    struggle = null;                 // 上一局时间到时可能正拉着大货，没清的话这一局点屏全被 QTE 吃掉
    // 每日挑战：整局世界都从今天的日期播种；平时用真随机
    gRnd = daily ? mulberry32(seedFromString("treasureCove-" + todayKey())) : Math.random;
    spawnTimer = 0; chestTimer = grand(4, 7); bossTimer = grand(15, 25);
    schoolTimer = grand(10, 18);
    bonusGiven = 0; fever = false;
    powers = { magnet: 0, bighook: 0, turbo: 0 };
    inkT = 0; inkBlobs.length = 0; emotes.clear();
    powersSeen.clear();
    roundStat = { maxChain:0, maxCombo:0, powersUsed:0, score:0, mineHits:0, scene, caught:{},
                  mpRank:0, mpPlayers:0, sharkMeals:0 };
    rollMissions();
    if (!online) { gmap = pickMap(); setScene(pickScene()); announceScene(); }
    el.stage.classList.remove("fever");
    for (let i = 0, n = Math.round(14 * widthScale()); i < n; i++) {   // 开局就有一片鱼群
      spawnRandom();
      const it = items[items.length - 1];
      it.x = grand(30, W - 30);
    }
    syncHud();
  }

  function announceScene() {
    pop(W / 2, SEA_Y + 96, t("map_here", { name: mapName(gmap) }), "#ffd24a", 21);
    if (scene !== "day") pop(W / 2, SEA_Y + 130, t("sc_" + scene), "#cfe6f2", 20);
  }

  function startGame() {
    resetGame();
    state = "playing";
    el.menu.classList.add("hidden");
    el.over.classList.add("hidden");
    beep(660, 0.12, "triangle", 0.05);
  }

  let repaintResults = null;                      // 切语言时用它把结算页整体重排

  function paintSoloResults(entry) {
    el.overMiss.innerHTML = missions.length
      ? t("miss_prefix") + missions.map(m =>
          m.done ? `<b style="color:#9be7ff">✔ ${missionText(m.def)} +${m.def.reward}</b>`
                 : `<span style="opacity:.55">✕ ${missionText(m.def)}${prog(m)}</span>`
        ).join("　") : "";
    el.overScore.textContent = t("pts", { n: score });
    renderRanks(el.overRank, entry);
    const rows = Object.keys(KINDS).filter(k => caught[k]);
    // 加成 = 总分 − 各目标底分 − 任务奖励（任务已经单独列在上面一行了）
    const bonus = score - rows.reduce((a, k) => a + KINDS[k].score * caught[k], 0) - missionPoints;
    el.overTable.innerHTML = rows.length
      ? rows.map(k => `<span>${kindName(k)} ×${caught[k]}</span><span>${t("pts", { n: earned[k] })}</span>`).join("")
      : `<span>${t("nothing")}</span><span>${t("pts", { n: 0 })}</span>`;
    el.overDex.textContent = newSeen.length
      ? t("dex_new", { list: newSeen.join(lang === "en" ? ", " : "、"), a: seen.size, b: KIND_IDS.length })
      : (seen.size >= KIND_IDS.length ? t("dex_all") : t("dex_prog", { a: seen.size, b: KIND_IDS.length }));
    el.overBest.textContent =
      (bonus > 0 ? t("bonus_line", { n: bonus }) : "") +
      (score >= best && score > 0 ? t("newrec") : t("best_gap", { b: best, d: best - score }));
    paintAchvLine();
    renderFishPane();                           // 语言切换重画时也要跟着更新
  }

  function endGame() {
    state = "over";
    struggle = null;
    showPane("sum");                            // 每局结算先看战果，鱼那栏点了再看
    el.overPlayers.style.display = "none";
    el.overRank.style.display = "";
    for (const m of missions) {                   // 「整局不碰水雷」要等局末才知道
      if (!m.done && m.def.clean && mineHits === 0) missionDone(m);
    }
    if (score > best) { best = score; bests[roundTime] = best; saveBests(); }
    el.best.textContent = best;
    const entry = { sc: score, at: Date.now() };
    if (score > 0) {
      recordScore(score, daily ? "daily" : "solo");
      entry.at = ranks.find(x => x.sc === score)?.at || entry.at;
    }
    if (daily) { saveDaily(score); refreshDaily(); }
    lastGotA = checkAchievements();
    paintSoloResults(entry);
    renderDex();
    repaintResults = () => paintSoloResults(entry);
    el.over.classList.remove("hidden");
    score >= best && score > 0 ? fanfare() : beep(220, 0.35, "sawtooth", 0.05);
  }

  function syncHud() {
    el.score.textContent = score;
    el.time.textContent  = Math.ceil(timeLeft);
    el.timeBoard.classList.toggle("warn", state === "playing" && timeLeft <= 10);
  }

  // ───────────────────────── 放钩 / 收线 ─────────────────────────
  const MAX_CHAIN = 8;                             // 一趟最多串几个
  const SEEN_POP_Y = SEA_Y + 108;                  // 图鉴解锁提示的高度

  /* 每局随机 3 个小目标：除了「分数越高越好」，再给点具体的追求。
     只在单人局生效 —— 联机的分数由服务器结算，本地不该自己加分。 */
  const MISSIONS = [
    { zh:"钓 2 只乌贼",     en:"Catch 2× Squid",        goal:2, reward:300, kind:"squid"  },
    { zh:"钓 2 只海龟",     en:"Catch 2× Sea Turtle",   goal:2, reward:300, kind:"turtle" },
    { zh:"钓 8 枚金币",     en:"Collect 8× Coin",       goal:8, reward:250, kind:"coin"   },
    { zh:"钓 3 条河豚",     en:"Catch 3× Pufferfish",   goal:3, reward:250, kind:"puffer" },
    { zh:"钓 2 只螃蟹",     en:"Catch 2× Crab",         goal:2, reward:300, kind:"crab"   },
    { zh:"钓 1 个宝箱",     en:"Land a Treasure Chest", goal:1, reward:300, kind:"chest"  },
    { zh:"钓 1 条灯笼鱼",   en:"Land an Anglerfish",    goal:1, reward:400, kind:"angler" },
    { zh:"拉上 1 只巨兽",   en:"Land the Deep-Sea Beast", goal:1, reward:500, kind:"boss" },
    { zh:"一次串钩 4 个",   en:"Chain 4 in one haul",   goal:1, reward:350, chain:4       },
    { zh:"一次串钩 6 个",   en:"Chain 6 in one haul",   goal:1, reward:500, chain:6       },
    { zh:"连击到 6",        en:"Reach a 6 combo",       goal:1, reward:300, combo:6       },
    { zh:"连击到 10",       en:"Reach a 10 combo",      goal:1, reward:500, combo:10      },
    { zh:"FEVER 里钓 5 个", en:"Catch 5 during FEVER",  goal:5, reward:400, inFever:true  },
    { zh:"整局不碰水雷",    en:"Finish without a mine", goal:1, reward:400, clean:true    },
  ];
  const missionText = d => (lang === "en" && d.en) ? d.en : d.zh;
  // 进度括号：中文用全角，英文用半角
  const prog = m => lang === "en"
    ? ` (${Math.min(m.prog, m.def.goal)}/${m.def.goal})`
    : `（${Math.min(m.prog, m.def.goal)}/${m.def.goal}）`;
  let missions = [], mineHits = 0, missionPoints = 0;   // 任务奖励单独记，别混进连击加成


  let lastGotA = [];                               // 这一局刚解锁的成就 id，重画结算页时要用

  // 这一局的统计，成就判定只看它
  let roundStat = { maxChain:0, maxCombo:0, powersUsed:0, score:0, mineHits:0, scene:"day", caught:{},
                    mpRank:0, mpPlayers:0, sharkMeals:0 };
  const powersSeen = new Set();

  function paintAchvLine() {
    el.overAchv.textContent = lastGotA.length
      ? t("achv_list", { list: lastGotA.map(id => achvName(ACHIEVEMENTS.find(a => a.id === id)))
                                     .join(lang === "en" ? ", " : "、") })
      : t("achv_none");
  }

  function checkAchievements(extra) {
    const r = Object.assign({}, roundStat, {
      score, mineHits, scene, caught, powersUsed: powersSeen.size,
    }, extra || {});
    const got = [];
    for (const a of ACHIEVEMENTS) {
      if (achv.has(a.id)) continue;
      let ok = false;
      try { ok = !!a.test(r); } catch (_) {}
      if (ok) { achv.add(a.id); got.push(a.id); }
    }
    if (got.length) {
      try { localStorage.setItem(ACHV_KEY, JSON.stringify([...achv])); } catch (_) {}
      got.forEach((id, i) => setTimeout(() => {
        pop(W / 2, SEA_Y + 200 + i * 26,
            t("achv_new", { name: achvName(ACHIEVEMENTS.find(a => a.id === id)) }), "#ffd24a", 20);
        fanfare();
      }, i * 400));
    }
    return got;
  }

  function rollMissions() {
    const pool = MISSIONS.slice();
    missions = [];
    for (let i = 0; i < 3 && pool.length; i++) {
      const m = pool.splice(Math.floor(gRnd() * pool.length), 1)[0];
      missions.push({ def: m, prog: 0, done: false });
    }
    mineHits = 0;
    missionPoints = 0;
  }

  function missionDone(m) {
    m.done = true;
    score += m.def.reward;
    missionPoints += m.def.reward;
    pop(W / 2, SEA_Y + 150, t("pop_mission", { text: missionText(m.def), r: m.def.reward }), "#9be7ff", 21);
    [780, 980, 1180].forEach((f, i) => setTimeout(() => beep(f, 0.12, "triangle", 0.05), i * 70));
  }

  /** 每钓上一个东西调一次（单机）。ev = {kind, chain, combo, fever} */
  function missionEvent(ev) {
    if (online) return;
    for (const m of missions) {
      if (m.done) continue;
      const d = m.def;
      if (d.kind) { if (ev.kind === d.kind) m.prog++; }
      else if (d.inFever) { if (ev.fever) m.prog++; }
      else if (d.chain) { if (ev.chain >= d.chain) m.prog = d.goal; }
      else if (d.combo) { if (ev.combo >= d.combo) m.prog = d.goal; }
      if (m.prog >= d.goal) missionDone(m);
    }
  }
  // 钓上大货多给时间：真正的代价是时间，所以大货必须把时间还回来一部分
  /* 鲨鱼是唯一「身价会变」的目标：每吃掉一条小鱼就多值 MEAL_VALUE 分。
     所以凡是要问「这东西值多少」的地方都走 itemScore(it)，不能再直接读 kind.score。 */
  const MEAL_VALUE = 70, MAX_MEALS = 6;
  const itemScore = it => it.kind.score + (it.meals || 0) * MEAL_VALUE;
  const timeBonus = it => { const v = itemScore(it);
    return v >= 400 ? 3 : v >= 150 ? 2 : v >= 60 ? 1 : 0; };

  // 鲨鱼吃什么：只吃比自己小得多的游鱼，宝箱 / 道具 / 危险物 / 巨兽都不碰
  const PREY = { small:1, clown:1, medium:1, big:1, jelly:1, squid:1, seahorse:1 };

  function cast(x) {
    if (state !== "playing" || spectating) return;   // 观众没有钩子
    if (hook.state === "down") { reel(); return; }  // 下沉途中再点一下 = 立刻收线
    if (hook.state !== "idle") return;
    hook.x = clamp(x, 20, W - 20);
    hook.y = SEA_Y;
    hook.state = "down";
    hook.catches = [];
    struggle = null;
    splash(hook.x, SEA_Y, 9, "#cdeeff");
    beep(760, 0.07, "square", 0.03);
  }

  function reel() {
    hook.state = "up";
    hook.pull  = pullSpeed();
  }

  function startStruggle(it) {
    struggle = {
      pos: 0.5, dir: Math.random() < 0.5 ? 1 : -1,
      speed: 0.5 + itemScore(it) / 2200,          // 越值钱指针跑越快
      zone: 0.17, boost: 0, stall: 0, hits: 0,
      name: kindName(it.id),
    };
    pop(hook.x, hook.y - 74, t("qte_tip"), "#9be7ff", 18);
  }

  function tapStruggle() {
    const g = struggle;
    if (!g) return;
    if (Math.abs(g.pos - 0.5) <= g.zone) {          // 命中绿区
      g.hits++;
      g.boost = 0.8;
      g.zone  = Math.max(0.07, g.zone - 0.02);      // 越拉越难
      g.speed += 0.08;
      pop(hook.x, hook.y - 50, t("qte_good"), "#8bf5a8", 19);
      beep(660 + Math.min(6, g.hits) * 90, 0.09, "square", 0.04);
    } else {
      g.stall = 0.5;
      pop(hook.x, hook.y - 50, t("qte_miss"), "#ff9f6b", 18);
      beep(200, 0.12, "square", 0.035);
    }
  }

  function stepStruggle(dt) {
    const g = struggle;
    if (!g) return 1;
    g.boost = Math.max(0, g.boost - dt);
    g.stall = Math.max(0, g.stall - dt);
    g.pos  += g.dir * g.speed * dt;
    if (g.pos > 1) { g.pos = 1; g.dir = -1; }
    if (g.pos < 0) { g.pos = 0; g.dir = 1; }
    return g.boost > 0 ? 2.3 : g.stall > 0 ? 0.35 : 1;   // 收线速度倍率
  }

  // 空钩拉得飞快；挂上东西后取最难拉的那个，每多挂一个再慢一档
  function pullSpeed() {
    const turbo = powers.turbo > 0 ? POWERS.turbo.mult : 1;
    if (!hook.catches.length) return 470 * turbo;
    const slowest = Math.min(...hook.catches.map(c => c.kind.pull));
    return Math.max(45, slowest * Math.pow(0.85, hook.catches.length - 1)) * turbo;
  }

  // 把串上的东西一个接一个挂在钩子下面
  function layChain() {
    let off = 0;
    for (const it of hook.catches) {
      off  += it.kind.hh * 0.9;
      it.x  = hook.x + Math.sin(waveT * 8 + off * 0.05) * 4;
      it.y  = hook.y + off;
      off  += it.kind.hh * 0.9;
    }
  }

  function tryHook() {
    if (hook.catches.length >= MAX_CHAIN) return false;
    let hit = null, bestD = Infinity;
    for (const it of items) {
      const reach = powers.bighook > 0 ? POWERS.bighook.mult : 1;
      const dx = (hook.x - it.x) / (it.kind.hw * reach + 4), dy = (hook.y - it.y) / (it.kind.hh * reach + 4);
      const d  = dx * dx + dy * dy;
      if (d <= 1 && d < bestD) { bestD = d; hit = it; }
    }
    if (!hit) return false;
    // 联机时先乐观挂上（手感优先），服务器说被别人抢先了再摘掉
    // 服务器只存出生参数、不模拟位置，所以爆点（河豚/水雷）必须由钓到的人上报
    if (online) NET.send({ t:"grab", id: hit.netId, x: Math.round(hit.x), y: Math.round(hit.y) });
    items.splice(items.indexOf(hit), 1);
    hit.life = Infinity;                           // 钩住后不会消失
    hook.catches.push(hit);
    hook.pull = pullSpeed();                       // 越串越沉
    roundStat.maxChain = Math.max(roundStat.maxChain, hook.catches.length);
    const n = hook.catches.length;
    beep(itemScore(hit) >= 400 ? 990 : 430 + n * 70, 0.1, "square", 0.04);
    if (!spectating && itemScore(hit) >= 400) startStruggle(hit);
    if (hit.id === "boss")   pop(hook.x, hook.y - 60, t("pop_boss"), "#ff9f6b", 20);
    if (hit.id === "angler") pop(hook.x, hook.y - 50, t("pop_rare"), "#ffe07a", 19);
    if (n >= 2) pop(hook.x, hook.y - 34, t("pop_chain", { n }), "#ffd24a", 19);
    return true;
  }

  function hazardHit(it, px, py) {
    const k = it.kind;
    if (k.penalty && !online) timeLeft = Math.max(0, timeLeft - k.penalty);
    const nm = kindName(it.id || (k === KINDS.mine ? "mine" : "boot"));
    pop(px, py, k.penalty ? t("pop_haz_pen", { name: nm, s: k.penalty }) : t("pop_haz_0", { name: nm }),
        k.labelColor || "#ff8a7a", 20);
    if (k.penalty) {
      shakeT = 0.32;
      splash(px, SEA_Y, 22, "#ff8a7a");
      el.timeBoard.classList.add("warn");
      clearTimeout(hazardHit.t);
      hazardHit.t = setTimeout(() => syncHud(), 700);
      [220, 150, 90].forEach((f, i) => setTimeout(() => beep(f, 0.2, "sawtooth", 0.06), i * 70));
      if (navigator.vibrate) try { navigator.vibrate(120); } catch (_) {}
    } else {
      beep(200, 0.16, "square", 0.035);
    }
  }

  /* 钓到河豚会「砰」地炸开，把附近的鱼震晕几秒（静止 = 好钓）；
     水雷炸开则把周围的鱼炸散。联机时所有人都在 grabbed 消息里收到同一个爆点，
     各自用同一套规则算 —— 这样两边的鱼群不会走岔。 */
  function applyBurst(kindId, bx, by) {
    if (kindId === "puffer") {
      let n = 0;
      for (const it of items) {
        if (Math.hypot(it.x - bx, it.y - by) < 170 && !it.kind.hazard) { it.stun = 3; n++; }
      }
      splash(bx, by, 16, "#f2e07a");
      if (n) pop(bx, by - 30, t("burst_puffer"), "#f2e07a", 18);
      beep(300, 0.18, "square", 0.05);
    } else if (kindId === "mine") {
      for (const it of items) {
        const dx = it.x - bx, dy = it.y - by, d = Math.hypot(dx, dy);
        if (d < 230 && d > 1) {
          it.vx = (dx / d) * 150 + it.vx * 0.3;       // 往外炸散
          it.y  = clamp(it.y + (dy / d) * 26, TOP, FLOOR_Y - 20);
          it.stun = 0;
        }
      }
      splash(bx, by, 26, "#ff8a7a");
      pop(bx, by - 30, t("burst_mine"), "#ff8a7a", 18);
    }
  }

  function inkSplat() {                            // 被泼墨：糊住视野一会儿
    inkT = 2.8;
    inkBlobs.length = 0;
    /* 要几坨分开的墨点，不要糊成一整块 —— 半径别太大，
       并且横向按格子铺开，不然随机一挤就把半屏堵死了。 */
    for (let i = 0; i < 8; i++) {
      inkBlobs.push({ x: (i + rand(0.15, 0.85)) / 8, y: rand(0.1, 0.9), r: rand(42, 78) });
    }
    pop(W / 2, SEA_Y + 70, t("ink_hit"), "#c6a2ff", 22);
    beep(140, 0.3, "sawtooth", 0.05);
    if (navigator.vibrate) try { navigator.vibrate(90); } catch (_) {}
  }

  function activatePower(id, atX, atY) {
    const k = KINDS[id], P = POWERS[k.power];
    if (!P) return;
    if (P.offense) {                               // 墨囊：效果落在别人身上
      pop(atX, atY, t("ink_use"), "#c6a2ff", 20);
      beep(320, 0.2, "sawtooth", 0.05);
      return;
    }
    powersSeen.add(k.power);
    if (P.dur) powers[k.power] = Math.max(powers[k.power] || 0, P.dur);
    if (P.time && !online) timeLeft = Math.min(99, timeLeft + P.time);   // 联机由服务器加时
    pop(atX, atY, t("pw_" + k.power), k.labelColor || "#9be7ff", 20);
    [720, 900, 1120].forEach((f, i) => setTimeout(() => beep(f, 0.1, "triangle", 0.045), i * 60));
  }

  function land() {
    const list = hook.catches;
    if (online) {                                  // 得分在「钩到」那一刻就由服务器结算过了
      if (!list.length) {
        combo = 0;
        NET.send({ t:"miss" });
        pop(hook.x, SEA_Y + 24, t("pop_empty"), "#9fc0d4", 20);
        beep(180, 0.14, "square", 0.03);
      } else {
        const biggest = list.reduce((a, b) => itemScore(b) > itemScore(a) ? b : a, list[0]);
        splash(hook.x, SEA_Y, itemScore(biggest) >= 400 ? 24 : 12 + list.length * 3,
               biggest.kind.color || "#ffd24a");
        beep(820, 0.12, "triangle", 0.05);
      }
      hook.catches = [];
      hook.state   = "idle";
      struggle     = null;
      return;
    }
    if (!list.length) {
      combo = 0;
      pop(hook.x, SEA_Y + 24, t("pop_empty"), "#9fc0d4", 20);
      beep(180, 0.14, "square", 0.03);
    } else {
      let total = 0, bonusSec = 0, biggest = list[0];
      list.forEach((it, i) => {
        if (it.kind.hazard) {                      // 水雷 / 破靴子：不给分、连击清零
          combo = 0;
          if (it.kind.penalty) mineHits++;
          applyBurst(it.id, it.x, it.y);
          hazardHit(it, hook.x, SEA_Y + 16 + i * 22);
          return;
        }
        const gained = Math.round(itemScore(it) * comboMult() * (fever ? FEVER_MULT : 1));
        score += gained;
        combo++;                                   // 一串里每一个都算一次连击
        roundStat.maxCombo = Math.max(roundStat.maxCombo, combo);
        total += gained;
        bonusSec += timeBonus(it);
        caught[it.id] = (caught[it.id] || 0) + 1;
        earned[it.id] = (earned[it.id] || 0) + gained;
        if (!seen.has(it.id)) {                    // 图鉴新解锁
          seen.add(it.id);
          newSeen.push(it.kind.name);
          try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen])); } catch (_) {}
          pop(hook.x, SEEN_POP_Y, t("pop_dex", { name: kindName(it.id) }), "#9be7ff", 20);
        }
        if (itemScore(it) > itemScore(biggest)) biggest = it;
        if (it.id === "shark") roundStat.sharkMeals = Math.max(roundStat.sharkMeals || 0, it.meals || 0);
        missionEvent({ kind: it.id, chain: list.length, combo, fever });
        if (it.id === "puffer") applyBurst("puffer", it.x, it.y);
        if (it.kind.power) activatePower(it.id, hook.x, SEA_Y + 16 + i * 22);
        const gtxt = t("pop_gain", { name: kindName(it.id), n: gained });
        if (list.length === 1) {
          pop(hook.x, SEA_Y + 16, gtxt, it.kind.color || "#ffd24a");
        } else {
          pop(hook.x, SEA_Y + 16 + i * 22, gtxt, it.kind.color || "#ffd24a", 17);
        }
      });
      if (list.length >= 2 && total > 0) {
        pop(hook.x, SEA_Y - 12, t("pop_string", { n: list.length, t: total }), "#ffd24a", 24);
      }
      const add = fever ? 0 : Math.min(bonusSec, bonusCap() - bonusGiven);
      if (add > 0) {                               // 时间奖励：钓大货才回时间，每局有总上限
        bonusGiven += add;
        timeLeft = Math.min(99, timeLeft + add);
        pop(hook.x + 70, SEA_Y + 40, `+${add}s`, "#8bf5a8", 21);
        el.timeBoard.classList.add("boost");
        clearTimeout(land.boostT);
        land.boostT = setTimeout(() => el.timeBoard.classList.remove("boost"), 700);
      }
      splash(hook.x, SEA_Y, itemScore(biggest) >= 400 ? 24 : 12 + list.length * 3,
             biggest.kind.color || "#ffd24a");
      itemScore(biggest) >= 400 || list.length >= 3
        ? fanfare() : beep(820, 0.12, "triangle", 0.05);
    }
    hook.catches = [];
    hook.state   = "idle";
    struggle     = null;
    syncHud();
  }

  // ───────────────────────── 更新 ─────────────────────────
  function moveItem(it, dt) {
    it.t   += dt;
    it.wob += dt * 4;
    it.life -= dt;
    if (it.stun > 0) { it.stun -= dt; return; }        // 被震晕：原地不动

    switch (it.kind.move) {
      case "coin":
        it.x += it.vx * dt;
        it.y += Math.sin(it.t * 1.6) * 14 * dt;
        if (powers.magnet > 0 && (it.id === "coin" || it.kind.power)) {   // 磁铁把金币和道具吸过来
          const dx = hook.x - it.x, dy = hook.y - it.y;
          const d = Math.hypot(dx, dy);
          if (d > 4 && d < 420) { it.x += (dx / d) * 200 * dt; it.y += (dy / d) * 200 * dt; }
        }
        break;
      case "drift":                                   // 水母：一鼓一缩慢慢上浮
        it.y -= (10 + Math.sin(it.t * 2.2) * 8) * dt;
        it.x += it.vx * dt + Math.sin(it.t * 0.8) * 6 * dt;
        break;
      case "paddle":                                  // 海龟：慢慢划水
        it.x += it.vx * dt;
        it.y += Math.sin(it.t * 1.1) * 10 * dt;
        break;
      case "jet":                                     // 乌贼：偶尔喷水急冲
        it.dart -= dt;
        if (it.dart <= 0 && Math.random() < dt * 0.5) it.dart = 0.6;
        it.x += it.vx * (it.dart > 0 ? 3.4 : 1) * dt;
        it.y += Math.sin(it.t * 2.6) * 12 * dt;
        break;
      case "crawl":                                   // 螃蟹：在海底横着走，撞边就转身
        it.x += it.vx * dt;
        it.y  = FLOOR_Y - 14 + Math.abs(Math.sin(it.t * 6)) * 3;
        if (it.x < 26 || it.x > W - 26) it.vx *= -1;
        break;
      case "hunt": {                                  // 鲨鱼：巡游 → 盯上猎物 → 冲过去吃掉
        it.chomp = Math.max(0, it.chomp - dt);
        let prey = null, best = 300;                  // 300px 以内才会去追
        for (const o of items) {
          if (o === it || !PREY[o.id]) continue;
          const d = Math.hypot(o.x - it.x, o.y - it.y);
          if (d < best) { best = d; prey = o; }
        }
        if (prey && it.meals < MAX_MEALS) {
          const dx = prey.x - it.x, dy = prey.y - it.y;
          const d  = Math.max(1, Math.hypot(dx, dy));
          const sp = 96;                              // 追击时比巡游快
          it.x += (dx / d) * sp * dt;
          it.y += (dy / d) * sp * dt;
          it.vx = dx >= 0 ? Math.abs(it.vx) : -Math.abs(it.vx);   // 朝着猎物那边画
          if (d < it.kind.hw * 0.55) eatPrey(it, prey);
        } else {
          it.x += it.vx * dt;                         // 没目标就正常巡游
          it.y += Math.sin(it.t * 0.9) * 12 * dt;
        }
        it.y = clamp(it.y, TOP + 30, FLOOR_Y - 30);
        break;
      }
      case "rise":                                    // 宝箱：缓缓上浮
        it.x += it.vx * dt;
        it.y -= 6 * dt;
        break;
      default:                                        // 游鱼
        it.x += it.vx * dt;
    }
  }

  /* 鲨鱼吃掉一条鱼：那条鱼从海里消失（玩家真的少了一个目标），
     鲨鱼身价 +MEAL_VALUE 并且长大一点 —— 所以「先让它吃饱再钓」是划算的赌博：
     等得越久它越值钱，但小鱼也被它吃得越少。 */
  function eatPrey(shark, prey) {
    const i = items.indexOf(prey);
    if (i < 0) return;
    items.splice(i, 1);
    shark.meals = Math.min(MAX_MEALS, (shark.meals || 0) + 1);
    shark.chomp = 0.28;
    splash(prey.x, prey.y, 9, prey.kind.color || "#cfe6f2");
    pop(prey.x, prey.y - 16, t("pop_eaten", { name: kindName(prey.id) }), "#ff9f6b", 17);
    beep(150, 0.13, "sawtooth", 0.05);
    setTimeout(() => beep(110, 0.1, "sawtooth", 0.04), 70);
  }

  function update(dt) {
    waveT += dt;
    for (const k in powers) if (powers[k] > 0) powers[k] = Math.max(0, powers[k] - dt);
    if (inkT > 0) inkT = Math.max(0, inkT - dt);
    bob = Math.sin(waveT * 1.5) * 5 * ((SCENES[scene] || SCENES.day).bob || 1);

    ship.x    = W / 2 + Math.sin(waveT * 0.3) * (W * 0.24);
    ship.tipX = ship.x + 62;
    ship.tipY = SEA_Y - 96 + bob;
    if (hook.state === "idle") { hook.x = ship.tipX; hook.y = SEA_Y + 8; }

    if (Math.random() < dt * 10) {
      bubbles.push({ x: rand(0, W), y: FLOOR_Y, r: rand(1.5, 4), vy: rand(26, 62) });
    }
    for (const b of bubbles) { b.y -= b.vy * dt; b.x += Math.sin(b.y * 0.05) * 0.4; }
    bubbles = bubbles.filter(b => b.y > SEA_Y);

    for (const s of sparks) { s.t += dt; s.vy += 430 * dt; s.x += s.vx * dt; s.y += s.vy * dt; }
    sparks = sparks.filter(s => s.t < s.life);

    for (const p of pops) { p.t += dt; p.y -= 32 * dt; }
    pops = pops.filter(p => p.t < 1.4);

    for (const it of items) moveItem(it, dt);
    items = items.filter(it => {
      const m = it.kind.hw * 3;
      return it.life > 0 && it.y > SEA_Y + 6 && it.x > -m && it.x < W + m;
    });

    if (state !== "playing") return;

    if (online) {                                  // 出鱼、计时、FEVER 都由服务器下发
      timeLeft = Math.max(0, timeLeft - dt);        // 两次 tick 之间自己走，读数才不卡
      netHookReport(dt);
      netLerpHooks(dt);
      moveHook(dt);
      syncHud();
      return;
    }

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; syncHud(); endGame(); return; }

    // 最后冲刺：一进入就锁定到本局结束，同时停发时间奖励，
    // 所以它永远是「最后一段」，不会被大货把时间顶回去而反复开关
    if (!fever && timeLeft <= feverAt()) {
      fever = true;
      bgmRate();
      pop(W / 2, SEA_Y + 90, t("pop_fever"), "#ffb35e", 27);
      el.stage.classList.add("fever");
      [660, 830, 990, 1240].forEach((f, i) => setTimeout(() => beep(f, 0.16, "square", 0.05), i * 80));
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (items.length < maxItems()) spawnRandom();
      if (fever && items.length < maxItems()) spawnRandom();   // 冲刺时鱼群加倍涌入
      // 海面越宽，出鱼越密，密度才和标准宽度一致
      spawnTimer = (fever ? grand(0.22, 0.45) : grand(0.45, 0.9)) / widthScale();
    }
    chestTimer -= dt;
    if (chestTimer <= 0) {
      spawn("chest");
      beep(360, 0.2, "triangle", 0.045);
      chestTimer = fever ? grand(4, 7) : grand(9, 15);
    }
    schoolTimer -= dt;
    if (schoolTimer <= 0) {
      spawnSchool();
      schoolTimer = grand(16, 30);
    }
    bossTimer -= dt;
    if (bossTimer <= 0 && !items.some(i => i.id === "boss")) {
      spawn("boss");
      pop(W / 2, SEA_Y + 60, t("pop_boss_spawn"), "#ff9f6b");
      beep(90, 0.55, "sawtooth", 0.06);
      bossTimer = fever ? grand(12, 20) : grand(22, 34);
    }

    moveHook(dt);
    syncHud();
  }

  function moveHook(dt) {
    if (hook.state === "down") {
      hook.y += 470 * dt;
      // 下沉不咬钩：像真机台一样沉到底（或玩家点第二下的深度）再往上收，
      // 收线途中把碰到的全部串走 —— 这样「选哪一竖排」才是真决策
      if (hook.y >= FLOOR_Y - 10) {
        hook.y = FLOOR_Y - 10;
        reel();
      }
    } else if (hook.state === "up") {
      hook.y -= hook.pull * stepStruggle(dt) * dt;
      tryHook();                                   // 收线途中撞到的一起串上来
      layChain();
      if (hook.y <= SEA_Y) { hook.y = SEA_Y; land(); }
    }
  }

  // ───────────────────────── 背景 ─────────────────────────
  /* 背景分两半：
     天空、云、小岛、海水渐变、光柱、海底这些是静态的 —— 每帧重建渐变再铺满
     几百万像素太贵（宽屏全屏时实测帧时间 30ms），所以烘到离屏画布，每帧贴一次。
     只有水面波纹、海草摆动、气泡这些动的还每帧画。 */
  const bgCanvas = document.createElement("canvas");
  const bgCtx    = bgCanvas.getContext("2d");

  function paintStatic(g) {
    const SC = SCENES[scene] || SCENES.day;
    const sky = g.createLinearGradient(0, 0, 0, SEA_Y);
    sky.addColorStop(0, SC.sky[0]); sky.addColorStop(1, SC.sky[1]);
    g.fillStyle = sky; g.fillRect(0, 0, W, SEA_Y);

    if (scene === "night") {                        // 夜里加点星星
      g.fillStyle = "rgba(255,255,255,.7)";
      for (let i = 0; i < Math.round(W / 26); i++) {
        const x = ((i * 97) % W) + (i % 5) * 7, y = 12 + ((i * 53) % (SEA_Y - 60));
        g.fillRect(x, y, i % 4 ? 2 : 3, i % 4 ? 2 : 3);
      }
    }
    g.fillStyle = SC.cloud;
    // 云按宽度铺开，数量也跟着长，否则加宽后天空一片空
    const clouds = [];
    for (let i = 0, n = Math.max(3, Math.round(W / 420)); i < n; i++) {
      const f = (i + 0.5) / n + (i % 2 ? 0.06 : -0.06);
      clouds.push([f * W, 38 + (i % 3) * 22, 15 + (i % 3) * 6]);
    }
    clouds.forEach(([x, y, r]) => {
        g.beginPath();
        g.arc(x, y, r, 0, Math.PI * 2);
        g.arc(x + r, y + 5, r * 0.72, 0, Math.PI * 2);
        g.arc(x - r, y + 7, r * 0.6, 0, Math.PI * 2);
        g.fill();
      });
    g.fillStyle = "#5d7f6a";                                   // 远处小岛
    g.beginPath();
    g.moveTo(W - 150, SEA_Y); g.quadraticCurveTo(W - 90, SEA_Y - 78, W - 20, SEA_Y);
    g.closePath(); g.fill();

    /* 海水颜色：天色和地图各有一套，取两者的中点 ——
       这样「深海沟的黄昏」既有黄昏的暖，也保住深海沟的沉。 */
    const MP = MAPS[gmap] || MAPS.open;
    const seaCols = MP.sea ? SC.sea.map((c, i) => mixHex(c, MP.sea[i], 0.5)) : SC.sea;
    const sea = g.createLinearGradient(0, SEA_Y, 0, H);
    sea.addColorStop(0, seaCols[0]); sea.addColorStop(0.4, seaCols[1]); sea.addColorStop(1, seaCols[2]);
    g.fillStyle = sea; g.fillRect(0, SEA_Y, W, H - SEA_Y);
    if (SC.dark) {                                  // 夜色直接烘进背景，别每帧铺一遍
      g.fillStyle = `rgba(2,10,20,${SC.dark})`;
      g.fillRect(0, SEA_Y, W, H - SEA_Y);
    }

    g.save();                                                  // 阳光光柱
    g.globalAlpha = SC.ray; g.fillStyle = "#dff4ff";
    for (let i = 0, n = Math.max(4, Math.round(W / 150)); i < n; i++) {
      const x = 60 + i * 150;
      g.beginPath();
      g.moveTo(x, SEA_Y); g.lineTo(x + 54, SEA_Y);
      g.lineTo(x + 170, H); g.lineTo(x + 30, H);
      g.closePath(); g.fill();
    }
    g.restore();

    g.fillStyle = MP.floor === "ice" ? "#123a52" : MP.floor === "wreck" ? "#0d2636" : "#0a2b3f";
    g.beginPath(); g.moveTo(0, H);                             // 海底
    for (let x = 0; x <= W; x += 30) g.lineTo(x, FLOOR_Y + Math.sin(x * 0.02) * 7);
    g.lineTo(W, H); g.closePath(); g.fill();
    paintFloor(g, MP.floor);
  }

  /* 海底装饰：一眼认出这是哪片海。全部烘进背景，每帧只贴一次，不花运行时。
     位置用固定的算式而不是随机 —— 换一次地图重烘一次，形状不能每次都跳。 */
  function paintFloor(g, kind) {
    const n = Math.max(4, Math.round(W / 150));
    const fy = x => FLOOR_Y + Math.sin(x * 0.02) * 7;
    if (kind === "coral") {
      for (let i = 0; i < n * 2; i++) {
        const x = ((i * 173) % (W - 40)) + 20, y = fy(x);
        const h = 26 + (i % 5) * 11;
        g.fillStyle = ["#ff8f6b", "#ffb35e", "#c98bd8", "#6fd3b6", "#f2778f"][i % 5];
        g.globalAlpha = 0.55;
        for (let b = 0; b < 3; b++) {                          // 一丛珊瑚：三根指状分枝
          g.beginPath();
          g.moveTo(x, y);
          g.quadraticCurveTo(x + (b - 1) * 9, y - h * 0.6, x + (b - 1) * 15, y - h);
          g.lineWidth = 5; g.strokeStyle = g.fillStyle; g.stroke();
          g.beginPath(); g.arc(x + (b - 1) * 15, y - h, 4, 0, Math.PI * 2); g.fill();
        }
        g.globalAlpha = 1;
      }
    } else if (kind === "rock") {
      g.fillStyle = "#08202f";
      for (let i = 0; i < n * 1.5; i++) {                      // 海底石笋
        const x = ((i * 211) % (W - 30)) + 15, y = fy(x), h = 34 + (i % 4) * 26;
        g.beginPath();
        g.moveTo(x - 13, y); g.lineTo(x + (i % 3 - 1) * 6, y - h); g.lineTo(x + 13, y);
        g.closePath(); g.fill();
      }
    } else if (kind === "wreck") {
      for (let i = 0, m = Math.max(1, Math.round(W / 700)); i < m; i++) {
        const x = 90 + i * 700, y = fy(x);
        g.save();
        g.translate(x, y); g.rotate(-0.18);
        g.fillStyle = "#43301c";                               // 破船身
        g.beginPath();
        g.moveTo(-95, 0); g.quadraticCurveTo(-70, 26, 60, 20);
        g.quadraticCurveTo(95, 12, 100, -6); g.lineTo(-88, -14);
        g.closePath(); g.fill();
        g.fillStyle = "#2f2113";
        for (let r = 0; r < 3; r++) g.fillRect(-60 + r * 44, -6, 16, 12);   // 舷窗
        g.strokeStyle = "#43301c"; g.lineWidth = 7;            // 断掉的桅杆
        g.beginPath(); g.moveTo(10, -12); g.lineTo(46, -78); g.stroke();
        g.restore();
      }
    } else if (kind === "ice") {
      g.fillStyle = "rgba(214,240,252,.5)";
      for (let i = 0; i < n; i++) {                            // 水面浮冰
        const x = ((i * 263) % (W - 80)) + 40;
        g.beginPath();
        g.moveTo(x - 46, SEA_Y); g.lineTo(x - 28, SEA_Y - 13);
        g.lineTo(x + 6, SEA_Y - 17); g.lineTo(x + 40, SEA_Y);
        g.closePath(); g.fill();
      }
      g.fillStyle = "rgba(150,205,230,.25)";
      for (let i = 0; i < n; i++) {                            // 海底冰棱
        const x = ((i * 157) % (W - 40)) + 20, y = fy(x), h = 22 + (i % 4) * 15;
        g.beginPath();
        g.moveTo(x - 12, y); g.lineTo(x, y - h); g.lineTo(x + 12, y);
        g.closePath(); g.fill();
      }
    }
  }

  // 两个 #rrggbb 按比例混一下
  function mixHex(a, b, f) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const mix = sh => Math.round((((pa >> sh) & 255) * (1 - f) + ((pb >> sh) & 255) * f));
    return "#" + [16, 8, 0].map(sh => mix(sh).toString(16).padStart(2, "0")).join("");
  }

  function buildBackground() {
    bgCanvas.width  = canvas.width;
    bgCanvas.height = canvas.height;
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgCtx.clearRect(0, 0, W, H);
    paintStatic(bgCtx);
  }

  /* 夜里的提灯。原来是每帧铺一整片径向渐变，1920 全屏下要 23ms（43fps）——
     换成「按物件」而不是「按像素」：暗色烘进背景（见 paintStatic），
     远处的鱼在 drawItem 里按距离降透明度（47 次乘法），
     钩子上再叠一张缓存好的光晕贴图。 */
  const LAMP_R = 150;
  const lampCanvas = document.createElement("canvas");
  (function bakeLamp() {
    lampCanvas.width = lampCanvas.height = LAMP_R * 2;
    const g = lampCanvas.getContext("2d");
    const rg = g.createRadialGradient(LAMP_R, LAMP_R, 8, LAMP_R, LAMP_R, LAMP_R);
    rg.addColorStop(0,   "rgba(255,236,170,.55)");
    rg.addColorStop(0.45,"rgba(255,226,150,.18)");
    rg.addColorStop(1,   "rgba(255,220,140,0)");
    g.fillStyle = rg;
    g.fillRect(0, 0, LAMP_R * 2, LAMP_R * 2);
  })();

  function drawLamp() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.drawImage(lampCanvas, hook.x - LAMP_R, hook.y - LAMP_R, LAMP_R * 2, LAMP_R * 2);
    ctx.restore();
  }

  // 夜里离提灯越远越看不清（标签不受影响，否则没法玩）
  function nightAlpha(it) {
    if (!SCENES[scene].dark) return 1;
    const dx = it.x - hook.x, dy = it.y - hook.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    return clamp(1 - (d - LAMP_R * 0.8) / 520, 0.22, 1);
  }

  function drawWeather(dt) {
    const SC = SCENES[scene];
    if (SC.rain) {
      ctx.strokeStyle = "rgba(200,225,240,.35)"; ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let i = 0, n = Math.round(W / 7); i < n; i++) {
        const x = (i * 137 + (waveT * 900) % W) % W;
        const y = (i * 211 + waveT * 1500) % (SEA_Y + 40);
        ctx.moveTo(x, y); ctx.lineTo(x - 5, y + 16);
      }
      ctx.stroke();
    }
    if (SC.bolt) {                                  // 偶尔一道闪电
      boltNext -= dt;
      if (boltNext <= 0) {
        boltT = 0.22; boltNext = rand(4, 11);
        beep(70, 0.5, "sawtooth", 0.05);
      }
      if (boltT > 0) {
        boltT = Math.max(0, boltT - dt);
        ctx.fillStyle = `rgba(240,250,255,${boltT * 1.6})`;
        ctx.fillRect(0, 0, W, H);
      }
    }
  }

  function drawBackground() {
    ctx.drawImage(bgCanvas, 0, 0, W, H);

    ctx.strokeStyle = "rgba(230,250,255,.75)"; ctx.lineWidth = 3;   // 水面波纹
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y = SEA_Y + Math.sin(x * 0.032 + waveT * 2.2) * 3.5 + Math.sin(x * 0.012 - waveT * 1.4) * 2;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 海草摆动 —— 石头海沟和冰海底下不该长草，那两张图跳过
    const floor = (MAPS[gmap] || MAPS.open).floor;
    if (floor !== "rock" && floor !== "ice") {
      ctx.strokeStyle = floor === "coral" ? "rgba(64,214,166,.55)" : "rgba(56,192,150,.5)";
      ctx.lineWidth = 6;
      for (let i = 0, n = Math.max(7, Math.round(W / 92)); i < n; i++) {
        const x = 30 + i * 92, h = 34 + (i % 3) * 26;
        ctx.beginPath(); ctx.moveTo(x, FLOOR_Y);
        ctx.quadraticCurveTo(x + Math.sin(waveT * 1.3 + i) * 15, FLOOR_Y - h * 0.6,
                             x + Math.sin(waveT * 1.3 + i) * 9, FLOOR_Y - h);
        ctx.stroke();
      }
    }
  }

  function drawShip() {
    const x = ship.x, y = SEA_Y - 8 + bob;
    ctx.save();
    ctx.translate(x, y);

    ctx.strokeStyle = "#4a2c12"; ctx.lineWidth = 5;      // 桅杆
    ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(-14, -122); ctx.stroke();
    ctx.fillStyle = "#22252b";                           // 黑帆
    ctx.beginPath(); ctx.moveTo(-14, -112); ctx.quadraticCurveTo(46, -92, -14, -62); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-14, -58);  ctx.quadraticCurveTo(40, -42, -14, -20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#111"; ctx.fillRect(-14, -138, 34, 18);   // 骷髅旗
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(1, -130, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-3, -125, 8, 3);

    ctx.fillStyle = "#8b5424";                           // 船身
    ctx.beginPath();
    ctx.moveTo(-62, -14); ctx.lineTo(66, -14);
    ctx.quadraticCurveTo(40, 20, 0, 20); ctx.quadraticCurveTo(-40, 20, -62, -14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#6b3f1d"; ctx.fillRect(-62, -19, 128, 6);
    ctx.fillStyle = "rgba(255,210,74,.85)";
    for (let i = 0; i < 4; i++) ctx.fillRect(-42 + i * 24, -10, 10, 7);

    ctx.fillStyle = "#f2d0a4"; ctx.beginPath(); ctx.arc(26, -38, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c0392b"; ctx.fillRect(19, -31, 15, 17);
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.moveTo(15, -43); ctx.lineTo(37, -43); ctx.lineTo(26, -52); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#e9dcbe"; ctx.lineWidth = 3.5;    // 钓竿
    ctx.beginPath(); ctx.moveTo(30, -30); ctx.lineTo(62, -88); ctx.stroke();
    ctx.restore();
  }

  function drawLine() {
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ship.tipX, ship.tipY);
    ctx.quadraticCurveTo((ship.tipX + hook.x) / 2, (ship.tipY + hook.y) / 2 + 16, hook.x, hook.y);
    ctx.stroke();
    const big = powers.bighook > 0;
    ctx.strokeStyle = big ? "#9be7ff" : "#e2ecf2"; ctx.lineWidth = big ? 4 : 2.6;
    ctx.beginPath(); ctx.arc(hook.x - 5, hook.y - 2, big ? 10 : 6, -0.4, Math.PI * 0.95); ctx.stroke();
  }

  // ───────────────────────── 各种海洋生物 ─────────────────────────
  function eye(x, y, r, look = 1) {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#14212a";
    ctx.beginPath(); ctx.arc(x + r * 0.3 * look, y, Math.max(1.2, r * 0.45), 0, Math.PI * 2); ctx.fill();
  }

  function artStarfish(it) {                             // 海星：五角，表面一层小疣
    const R = 20;
    ctx.fillStyle = "#ff8f6b";
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const r = i % 2 ? R * 0.42 : R;
      ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.5, Math.sin(a) * R * 0.5, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, Math.PI * 2); ctx.fill();
  }

  function artSeahorse(it) {                             // 海马：弯脖子、卷尾巴、背上一排小鳍
    const sw = Math.sin(it.wob) * 0.12;
    ctx.save();
    ctx.rotate(sw);
    ctx.fillStyle = "#ffc65c";
    ctx.beginPath();                                     // 身体：S 形
    ctx.moveTo(2, -22);
    ctx.quadraticCurveTo(13, -18, 9, -6);
    ctx.quadraticCurveTo(4, 6, 7, 16);
    ctx.quadraticCurveTo(9, 24, 1, 22);
    ctx.quadraticCurveTo(4, 14, 0, 6);
    ctx.quadraticCurveTo(-5, -4, -4, -14);
    ctx.quadraticCurveTo(-4, -22, 2, -22);
    ctx.fill();
    ctx.beginPath();                                     // 吻
    ctx.moveTo(2, -22); ctx.lineTo(13, -24); ctx.lineTo(3, -17); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#e09a2a"; ctx.lineWidth = 1.4;    // 背上的小棘
    for (let i = 0; i < 5; i++) {
      const y = -16 + i * 7;
      ctx.beginPath(); ctx.moveTo(-3 + i * 0.6, y); ctx.lineTo(-8 + i * 0.4, y + 2); ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,255,255,.5)";              // 背鳍
    ctx.beginPath(); ctx.ellipse(4, 2, 3.4, 7, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3a2a12";
    ctx.beginPath(); ctx.arc(3.5, -19, 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function artLobster(it) {                              // 龙虾：两只大钳、长触须、分节的尾
    const c = Math.sin(it.t * 5) * 0.22;                 // 钳子一开一合
    ctx.strokeStyle = "#c8451f"; ctx.lineWidth = 1.6;
    ctx.beginPath();                                     // 触须
    ctx.moveTo(16, -3); ctx.quadraticCurveTo(30, -12, 36, -22);
    ctx.moveTo(16, 1);  ctx.quadraticCurveTo(32, -2, 40, -8);
    ctx.stroke();
    ctx.fillStyle = "#d4502a";
    for (let sgn of [-1, 1]) {                           // 步足
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.translate(2 - i * 8, 6 * sgn);
        ctx.rotate(sgn * (0.5 + i * 0.14) + Math.sin(it.t * 6 + i) * 0.12);
        ctx.fillRect(0, -1.4, 13, 2.8);
        ctx.restore();
      }
    }
    ctx.fillStyle = "#e2603a";                           // 尾节
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.ellipse(-8 - i * 5, 0, 6.5 - i * 0.7, 8.5 - i * 1.2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#c8451f";
    ctx.beginPath();                                     // 尾扇
    ctx.moveTo(-27, 0); ctx.lineTo(-36, -8); ctx.lineTo(-33, 0); ctx.lineTo(-36, 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e2603a";                           // 头胸甲
    ctx.beginPath(); ctx.ellipse(4, 0, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
    for (let sgn of [-1, 1]) {                           // 大钳
      ctx.save();
      ctx.translate(15, 7 * sgn);
      ctx.rotate(sgn * (0.35 + c));
      ctx.fillStyle = "#d4502a";
      ctx.beginPath(); ctx.ellipse(6, 0, 9, 5.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(12, -3); ctx.lineTo(23, -5 - c * 8); ctx.lineTo(13, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(12, 3); ctx.lineTo(23, 5 + c * 8); ctx.lineTo(13, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = "#2b1408";
    ctx.beginPath(); ctx.arc(12, -4, 2, 0, Math.PI * 2);
    ctx.arc(12, 4, 2, 0, Math.PI * 2); ctx.fill();
  }

  function artManta(it) {                                // 蝠鲼：像在水里拍翅膀
    const f = Math.sin(it.wob * 0.9);                    // 翅膀上下扇动
    ctx.fillStyle = "#4a6b86";
    ctx.beginPath();                                     // 菱形的大翅
    ctx.moveTo(26, 0);
    ctx.quadraticCurveTo(6, -10, -30, -18 - f * 8);
    ctx.quadraticCurveTo(-14, -2, -34, 2);
    ctx.quadraticCurveTo(-14, 4, -30, 18 + f * 8);
    ctx.quadraticCurveTo(6, 10, 26, 0);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.22)";             // 背上的浅斑
    ctx.beginPath(); ctx.ellipse(0, -6, 9, 4, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 6, 9, 4, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#4a6b86"; ctx.lineWidth = 2.4;    // 细长的尾
    ctx.beginPath();
    ctx.moveTo(-32, 0); ctx.quadraticCurveTo(-48, f * 5, -60, f * 9); ctx.stroke();
    ctx.fillStyle = "#3a556c";                           // 头前的两只「角」
    ctx.beginPath(); ctx.moveTo(24, -4); ctx.lineTo(34, -8); ctx.lineTo(25, -1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(24, 4); ctx.lineTo(34, 8); ctx.lineTo(25, 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#0f1c26";
    ctx.beginPath(); ctx.arc(22, -5, 2.2, 0, Math.PI * 2); ctx.fill();
  }

  function artWhale(it) {                                // 鲸鱼：这一片海里最大的东西
    const L = 200, hh = 44;
    const sw = Math.sin(it.wob * 0.5) * 9;
    ctx.fillStyle = "#4c6d8a";
    ctx.beginPath();                                     // 尾鳍
    ctx.moveTo(-L * 0.40, 0);
    ctx.quadraticCurveTo(-L * 0.50, -6, -L * 0.56, -hh * 0.62 + sw);
    ctx.quadraticCurveTo(-L * 0.44, -hh * 0.12, -L * 0.56, hh * 0.62 + sw);
    ctx.quadraticCurveTo(-L * 0.50, 6, -L * 0.40, 0);
    ctx.fill();
    ctx.beginPath();                                     // 胸鳍
    ctx.moveTo(L * 0.02, hh * 0.42);
    ctx.quadraticCurveTo(-L * 0.06, hh * 0.95, -L * 0.16, hh * 0.72);
    ctx.quadraticCurveTo(-L * 0.06, hh * 0.42, L * 0.02, hh * 0.42);
    ctx.fill();

    ctx.fillStyle = "#5d80a0";                           // 身体
    ctx.beginPath();
    ctx.moveTo(L * 0.46, 0);
    ctx.quadraticCurveTo(L * 0.34, -hh * 0.86, L * 0.02, -hh * 0.9);
    ctx.quadraticCurveTo(-L * 0.26, -hh * 0.82, -L * 0.40, 0);
    ctx.quadraticCurveTo(-L * 0.26, hh * 0.86, L * 0.02, hh * 0.94);
    ctx.quadraticCurveTo(L * 0.34, hh * 0.9, L * 0.46, 0);
    ctx.fill();

    ctx.fillStyle = "rgba(233,245,252,.85)";             // 白肚皮 + 腹褶
    ctx.beginPath();
    ctx.moveTo(L * 0.4, hh * 0.16);
    ctx.quadraticCurveTo(L * 0.1, hh * 0.92, -L * 0.2, hh * 0.55);
    ctx.quadraticCurveTo(L * 0.08, hh * 0.44, L * 0.4, hh * 0.16);
    ctx.fill();
    ctx.strokeStyle = "rgba(90,130,160,.5)"; ctx.lineWidth = 1.6;
    for (let i = 0; i < 6; i++) {
      const x = L * 0.3 - i * L * 0.075;
      ctx.beginPath();
      ctx.moveTo(x, hh * 0.3); ctx.quadraticCurveTo(x - 6, hh * 0.55, x - 10, hh * 0.68);
      ctx.stroke();
    }
    ctx.fillStyle = "#3d5e7a";                           // 背鳍
    ctx.beginPath();
    ctx.moveTo(-L * 0.16, -hh * 0.78);
    ctx.lineTo(-L * 0.08, -hh * 1.12);
    ctx.lineTo(-L * 0.02, -hh * 0.8);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = "#22384a"; ctx.lineWidth = 2.4;    // 嘴线
    ctx.beginPath();
    ctx.moveTo(L * 0.46, hh * 0.08);
    ctx.quadraticCurveTo(L * 0.3, hh * 0.3, L * 0.14, hh * 0.28);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(L * 0.3, -hh * 0.22, 4.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#10202c";
    ctx.beginPath(); ctx.arc(L * 0.31, -hh * 0.22, 2.4, 0, Math.PI * 2); ctx.fill();

    // 喷气孔时不时冒一小串泡
    if (Math.sin(it.t * 1.3) > 0.93) {
      ctx.fillStyle = "rgba(220,245,255,.6)";
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(-L * 0.02, -hh * 0.95 - i * 9, 3 - i * 0.6, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function artShark(it) {                                // 鲨鱼：吃得越多画得越大
    const k = it.kind;
    const g = 1 + (it.meals || 0) * 0.055;               // 每吃一条胖一点
    ctx.scale(g, g);
    const L = k.len, hh = L * 0.23;
    const sw = Math.sin(it.wob * 0.8) * (L * 0.05);      // 尾巴摆动

    ctx.fillStyle = k.fin;
    ctx.beginPath();                                     // 新月形尾鳍
    ctx.moveTo(-L * 0.42, 0);
    ctx.lineTo(-L * 0.66, -hh * 1.5 + sw);
    ctx.quadraticCurveTo(-L * 0.56, 0, -L * 0.66, hh * 1.2 + sw);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                                     // 高背鳍 —— 鲨鱼的招牌
    ctx.moveTo(-L * 0.02, -hh * 0.9);
    ctx.lineTo(L * 0.10, -hh * 2.25);
    ctx.lineTo(L * 0.20, -hh * 0.85);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                                     // 胸鳍
    ctx.moveTo(L * 0.10, hh * 0.5);
    ctx.lineTo(L * 0.02, hh * 1.7);
    ctx.lineTo(L * 0.24, hh * 0.7);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = k.color;                             // 身体：前粗后细的梭形
    ctx.beginPath();
    ctx.moveTo(L * 0.5, 0);
    ctx.quadraticCurveTo(L * 0.22, -hh * 1.05, -L * 0.16, -hh * 0.72);
    ctx.quadraticCurveTo(-L * 0.34, -hh * 0.4, -L * 0.42, 0);
    ctx.quadraticCurveTo(-L * 0.34, hh * 0.4, -L * 0.16, hh * 0.72);
    ctx.quadraticCurveTo(L * 0.22, hh * 1.05, L * 0.5, 0);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,.82)";             // 白肚皮
    ctx.beginPath();
    ctx.moveTo(L * 0.42, hh * 0.16);
    ctx.quadraticCurveTo(L * 0.1, hh * 1.0, -L * 0.16, hh * 0.66);
    ctx.quadraticCurveTo(L * 0.1, hh * 0.4, L * 0.42, hh * 0.16);
    ctx.fill();

    ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = 1.6;   // 鳃裂
    for (let i = 0; i < 4; i++) {
      const gx = L * 0.2 - i * L * 0.045;
      ctx.beginPath();
      ctx.moveTo(gx, -hh * 0.42); ctx.lineTo(gx - L * 0.015, hh * 0.28); ctx.stroke();
    }

    const open = it.chomp > 0 ? hh * 0.62 : hh * 0.16;   // 咬的瞬间张嘴
    ctx.strokeStyle = "#2b3946"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(L * 0.5, hh * 0.02);
    ctx.quadraticCurveTo(L * 0.36, open, L * 0.2, open * 0.75);
    ctx.stroke();
    ctx.fillStyle = "#fff";                              // 牙
    for (let i = 0; i < 5; i++) {
      const tx = L * 0.46 - i * L * 0.055, ty = hh * 0.05 + open * 0.35 * (i / 5 + 0.3);
      ctx.beginPath();
      ctx.moveTo(tx, ty); ctx.lineTo(tx - 2.4, ty + 4.2); ctx.lineTo(tx + 2.4, ty + 4.2);
      ctx.closePath(); ctx.fill();
    }

    ctx.fillStyle = "#fff";                              // 眼
    ctx.beginPath(); ctx.arc(L * 0.3, -hh * 0.28, 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#10202c";
    ctx.beginPath(); ctx.arc(L * 0.31, -hh * 0.28, 2, 0, Math.PI * 2); ctx.fill();
  }

  function artFish(it) {                                 // 通用鱼：小丑鱼/蓝鱼/黄金鱼/大红鱼/鱼王
    const k = it.kind, L = k.len, hh = L * 0.3;
    const t = Math.sin(it.wob) * (L * 0.07);
    ctx.fillStyle = k.fin;
    ctx.beginPath();                                     // 尾
    ctx.moveTo(-L * 0.44, 0);
    ctx.lineTo(-L * 0.74, -hh * 0.8 + t);
    ctx.lineTo(-L * 0.74,  hh * 0.8 + t);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                                     // 背鳍
    ctx.moveTo(-L * 0.1, -hh * 0.85);
    ctx.lineTo(L * 0.05, -hh * 1.55);
    ctx.lineTo(L * 0.22, -hh * 0.8);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = k.color;                             // 身体
    ctx.beginPath(); ctx.ellipse(0, 0, L * 0.47, hh, 0, 0, Math.PI * 2); ctx.fill();

    if (k.stripe) {                                      // 小丑鱼的白条
      ctx.save();
      ctx.beginPath(); ctx.ellipse(0, 0, L * 0.47, hh, 0, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = "#fff";
      ctx.fillRect(-L * 0.26, -hh, L * 0.1, hh * 2);
      ctx.fillRect(L * 0.06, -hh, L * 0.09, hh * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = "rgba(255,255,255,.2)";
      ctx.beginPath(); ctx.ellipse(-L * 0.05, hh * 0.34, L * 0.3, hh * 0.34, 0, 0, Math.PI * 2); ctx.fill();
    }
    eye(L * 0.28, -hh * 0.22, Math.max(2.6, L * 0.055));

    if (k.crown) {                                       // 皇冠贴在头顶上，别浮空
      ctx.fillStyle = "#ffb703";
      ctx.beginPath();
      ctx.moveTo(L * 0.12, -hh * 0.92); ctx.lineTo(L * 0.18, -hh * 1.5);
      ctx.lineTo(L * 0.26, -hh * 1.05); ctx.lineTo(L * 0.34, -hh * 1.55);
      ctx.lineTo(L * 0.4, -hh * 0.8);
      ctx.closePath(); ctx.fill();
    }
  }

  function artSword(it) {                                // 剑鱼：长吻 + 高背鳍
    const t = Math.sin(it.wob) * 5;
    ctx.fillStyle = "#3f7fa8";
    ctx.beginPath();                                     // 尾
    ctx.moveTo(-46, 0); ctx.lineTo(-66, -16 + t); ctx.lineTo(-58, 0); ctx.lineTo(-66, 16 + t);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                                     // 背鳍
    ctx.moveTo(-16, -12); ctx.lineTo(-4, -34); ctx.lineTo(10, -11);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                                     // 腹鳍
    ctx.moveTo(-6, 10); ctx.lineTo(-14, 24); ctx.lineTo(6, 11);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#5aa7d2";                            // 身体
    ctx.beginPath(); ctx.ellipse(-8, 0, 44, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.ellipse(-10, 6, 30, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#d8e6ee"; ctx.lineWidth = 5;       // 剑
    ctx.beginPath(); ctx.moveTo(34, -1); ctx.lineTo(66, -3); ctx.stroke();
    eye(24, -4, 3.4);
  }

  function artAngler(it) {                               // 深海灯笼鱼：獠牙 + 发光灯笼
    const glow = 0.6 + Math.sin(it.t * 4) * 0.4;
    const lx = 30, ly = -34 + Math.sin(it.t * 2) * 3;
    ctx.fillStyle = `rgba(255,236,140,${0.18 * glow})`;   // 灯笼光晕
    ctx.beginPath(); ctx.arc(lx, ly, 30, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#2b3a45"; ctx.lineWidth = 3;       // 触须
    ctx.beginPath(); ctx.moveTo(6, -22); ctx.quadraticCurveTo(24, -40, lx, ly); ctx.stroke();
    ctx.fillStyle = "#fff4b0";
    ctx.beginPath(); ctx.arc(lx, ly, 7, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#243642";
    ctx.beginPath();                                      // 尾
    ctx.moveTo(-30, 0); ctx.lineTo(-48, -14); ctx.lineTo(-48, 14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#33505f";                            // 圆胖身体
    ctx.beginPath(); ctx.ellipse(0, 0, 36, 26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1b2b35";                            // 大嘴
    ctx.beginPath();
    ctx.moveTo(4, 2); ctx.quadraticCurveTo(28, -6, 34, 10);
    ctx.quadraticCurveTo(20, 20, 4, 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff";                               // 獠牙
    for (let i = 0; i < 4; i++) {
      const bx = 8 + i * 7;
      ctx.beginPath(); ctx.moveTo(bx, 2); ctx.lineTo(bx + 5, 2); ctx.lineTo(bx + 2, 12);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#ffd24a";
    ctx.beginPath(); ctx.arc(10, -8, 4.5, 0, Math.PI * 2); ctx.fill();
  }

  function artBoss(it) {                                 // 深海巨兽
    const L = 190, hh = 57, t = Math.sin(it.wob) * 12;
    ctx.fillStyle = "#0e1b26";
    ctx.beginPath();
    ctx.moveTo(-L * 0.42, 0);
    ctx.lineTo(-L * 0.72, -hh * 0.9 + t);
    ctx.lineTo(-L * 0.72,  hh * 0.9 + t);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                                      // 背棘
    for (let i = 0; i < 4; i++) {
      const x = -L * 0.2 + i * 26;
      ctx.moveTo(x, -hh * 0.8); ctx.lineTo(x + 10, -hh * 1.45); ctx.lineTo(x + 22, -hh * 0.75);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#20303f";
    ctx.beginPath(); ctx.ellipse(0, 0, L * 0.46, hh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.08)";
    ctx.beginPath(); ctx.ellipse(-8, hh * 0.35, L * 0.3, hh * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";                               // 獠牙
    for (let i = 0; i < 5; i++) {
      const bx = 8 + i * 15;
      ctx.beginPath(); ctx.moveTo(bx, 10); ctx.lineTo(bx + 8, 10); ctx.lineTo(bx + 4, 36);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,77,77,.25)";
    ctx.beginPath(); ctx.arc(L * 0.3, -hh * 0.3, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff4d4d";
    ctx.beginPath(); ctx.arc(L * 0.3, -hh * 0.3, 8, 0, Math.PI * 2); ctx.fill();
  }

  function artSquid(it) {                                 // 乌贼
    const wig = Math.sin(it.t * 5);
    ctx.strokeStyle = "#c65a86";                           // 触手（在身体前方摆动）
    ctx.lineCap = "round";
    for (let i = 0; i < 6; i++) {
      const oy = -13 + i * 5.2, sw = 1 + Math.sin(it.t * 4 + i);
      ctx.lineWidth = i === 0 || i === 5 ? 4.5 : 3;         // 外侧两条是长腕
      const len = i === 0 || i === 5 ? 62 : 48;
      ctx.beginPath();
      ctx.moveTo(14, oy * 0.55);
      ctx.quadraticCurveTo(14 + len * 0.55, oy * 0.8 + sw * 6,
