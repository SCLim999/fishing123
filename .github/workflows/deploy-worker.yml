# 把联机服务器部署到 Cloudflare —— 让 GitHub 代替你的电脑跑 wrangler。
#
# 给「手上只有手机」准备的：本地装不了 Node 也能部署。
# 只能手动触发（workflow_dispatch），push 不会自动跑。
#
# 你只需要配一样东西：
#   Secret  CLOUDFLARE_API_TOKEN   —— 建 Token 时勾 Workers Scripts: Edit
#
# Account ID 不是密钥（它就写在 Cloudflare 后台的地址栏里），所以随便哪种都行：
#   · 点 Run workflow 时填进那个输入框（临时用一次）
#   · 或存成仓库 Variable  CLOUDFLARE_ACCOUNT_ID（一次配好，以后直接点）
#   · 或存成 Secret 同名（也认）
#
# 详细步骤见 worker/README.md 的「只有手机时」一节。

name: Deploy multiplayer worker

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Cloudflare Account ID（留空就用仓库里存好的）'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Token 只能来自 Secret；Account ID 三个来源按优先级取第一个非空的
      - name: 检查凭证
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IN_ACCOUNT: ${{ inputs.account_id }}
          VAR_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SEC_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::缺少 Secret CLOUDFLARE_API_TOKEN。"
            echo "::error::去 Settings → Secrets and variables → Actions → New repository secret 添加，"
            echo "::error::值是 Cloudflare 后台建的 API Token（勾 Workers Scripts: Edit）。"
            exit 1
          fi
          ACCOUNT="${IN_ACCOUNT:-${VAR_ACCOUNT:-$SEC_ACCOUNT}}"
          if [ -z "$ACCOUNT" ]; then
            echo "::error::没有 Account ID。两个办法之一："
            echo "::error::① 重新点 Run workflow，在输入框里填上；"
            echo "::error::② 存成仓库 Variable：Settings → Secrets and variables → Actions → Variables"
            echo "::error::   → New repository variable，名字 CLOUDFLARE_ACCOUNT_ID。"
            echo "::error::Account ID 就在 Cloudflare 后台的地址栏里：dash.cloudflare.com/<这一段>"
            exit 1
          fi
          # Account ID 不是密钥，但也不必往日志里刷全文，只回显长度确认取到了
          echo "Token 有了；Account ID 有了（${#ACCOUNT} 位）。"
          echo "account_id=$ACCOUNT" >> "$GITHUB_OUTPUT"

      # 先空跑一遍：配置或代码有问题的话在这一步就报错，不会推上线
      - name: 空跑检查
        working-directory: worker
        run: npx --yes wrangler@4 deploy --dry-run

      - name: 部署
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.creds.outputs.account_id }}
        run: npx --yes wrangler@4 deploy

      - name: 接下来怎么用
        run: |
          echo '上一步日志里那行 https://treasure-cove-mp.<你的子域>.workers.dev 就是联机服务器地址。'
          echo '用浏览器打开它，看到「宝藏海湾联机服务器在跑」就成了。'
          echo '然后把这样的链接发给朋友（两处都换成你的地址）：'
          echo '  https://sclim999.github.io/fishing123/?server=https://treasure-cove-mp.<你的子域>.workers.dev&room=ABCD&name=Ann'
