# 把联机服务器部署到 Cloudflare —— 让 GitHub 代替你的电脑跑 wrangler。
#
# 给「手上只有手机」准备的：本地装不了 Node 也能部署。
# 只能手动触发（workflow_dispatch），push 不会自动跑。
#
# 需要两个仓库 Secret（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   用 "Edit Cloudflare Workers" 模板建的 API Token
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 后台右侧或地址栏里的 Account ID
#
# 详细步骤见 worker/README.md 的「只有手机时」一节。

name: Deploy multiplayer worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查 Secret 有没有配好
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN。到 Settings → Secrets and variables → Actions 添加。"
            exit 1
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "::error::缺少 CLOUDFLARE_ACCOUNT_ID。到 Settings → Secrets and variables → Actions 添加。"
            exit 1
          fi
          echo "两个 Secret 都在。"

      # 先空跑一遍：配置或代码有问题的话，在这一步就报错，不会推上线
      - name: 空跑检查
        working-directory: worker
        run: npx --yes wrangler@4 deploy --dry-run

      - name: 部署
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: 接下来怎么用
        run: |
          echo "上一步日志里那行 https://treasure-cove-mp.<你的子域>.workers.dev 就是联机服务器地址。"
          echo "用浏览器打开它，看到「宝藏海湾联机服务器在跑」就成了。"
          echo "然后把这样的链接发给朋友（两处都换成你的地址）："
          echo "  https://sclim999.github.io/fishing123/?server=https://treasure-cove-mp.<你的子域>.workers.dev&room=ABCD&name=Ann"
